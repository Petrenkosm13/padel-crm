  import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import{getFirestore,doc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const app=initializeApp({
    apiKey:"AIzaSyApGAnm3kdlmdNX0H3DnJQIpGXFrS6-2zA",
    authDomain:"padel-crm-6fdaa.firebaseapp.com",
    projectId:"padel-crm-6fdaa",
    storageBucket:"padel-crm-6fdaa.firebasestorage.app",
    messagingSenderId:"844325609833",
    appId:"1:844325609833:web:12b6b01d740297bf131df8"
  });
  const auth=getAuth(app);
  const db=getFirestore(app);
  let _unsub=null;
  getRedirectResult(auth).catch(()=>{});
  window._fb={
    signIn:()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>signInWithRedirect(auth,new GoogleAuthProvider())),
    signOut:()=>signOut(auth),
    onAuth:(cb)=>onAuthStateChanged(auth,cb),
    save:async(uid,data)=>{await setDoc(doc(db,"users",uid),data,{merge:true});},
    listen:(uid,cb)=>{
      if(_unsub)_unsub();
      _unsub=onSnapshot(doc(db,"users",uid),snap=>{if(snap.exists())cb(snap.data());});
      return()=>{if(_unsub)_unsub();};
    }
  };
  window._fbReady=true;
  window.dispatchEvent(new Event("fbReady"));
</script>

const CHAT_PLATFORMS=[

  {id:"whatsapp",  label:"WhatsApp",  emoji:"💬", base:"https://wa.me/",          prefix:"https://wa.me/",          placeholder:"380XXXXXXXXX (номер без +)"},

function ChatLinkPicker({value,onChange}){
  // Parse existing value to detect platform
  const detect=()=>{
    if(!value)return{plat:"",nick:""};
    const p=CHAT_PLATFORMS.find(p=>value.startsWith(p.prefix));
    if(p)return{plat:p.id,nick:value.slice(p.prefix.length)};
    return{plat:"",nick:value};
  };
  const {plat:initPlat,nick:initNick}=detect();
  const [plat,setPlat]=useState(initPlat);
  const [nick,setNick]=useState(initNick);

  const cp=CHAT_PLATFORMS.find(p=>p.id===plat);

  const update=(newPlat,newNick)=>{
    const p=CHAT_PLATFORMS.find(x=>x.id===newPlat);
    if(p&&newNick.trim()){
      onChange(p.prefix+newNick.trim());
    } else {
      onChange("");
    }
  };

  return(
    <Row label="Посилання на чат">
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
        {CHAT_PLATFORMS.map(p=>{
          const sel=plat===p.id;
          return(
            <button key={p.id} onClick={()=>{setPlat(p.id);update(p.id,nick);}}
              style={{padding:"5px 10px",borderRadius:8,
                border:`1px solid ${sel?"var(--accent)":"var(--border2)"}`,
                background:sel?"rgba(200,241,53,.08)":"var(--surface2)",
                color:sel?"var(--accent)":"var(--muted)",
                fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600,cursor:"pointer"}}>
              {p.emoji} {p.label}
            </button>
          );
        })}
        <button onClick={()=>{setPlat("");setNick("");onChange("");}}
          style={{padding:"5px 10px",borderRadius:8,border:"1px solid var(--border2)",
            background:"var(--surface2)",color:"var(--muted)",
            fontFamily:"'DM Sans',sans-serif",fontSize:12,cursor:"pointer"}}>✕ Очистити</button>
      </div>
      {plat&&(
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:12,color:"var(--muted)",whiteSpace:"nowrap",
            padding:"7px 8px",background:"var(--surface2)",border:"1px solid var(--border2)",
            borderRadius:"8px 0 0 8px",borderRight:"none"}}>
            {cp.prefix}
          </span>
          <input style={{...inp,borderRadius:"0 8px 8px 0",flex:1}}
            placeholder={cp.placeholder}
            value={nick}
            onChange={e=>{setNick(e.target.value);update(plat,e.target.value);}}/>
        </div>
      )}
      {!plat&&<input style={inp} placeholder="Оберіть платформу вище..." disabled
        style={{...inp,opacity:.4,cursor:"not-allowed"}}/>}
      {value&&<div style={{marginTop:5,fontSize:11,color:"var(--accent2)"}}>
        Посилання: {value}
      </div>}
    </Row>
  );
}

const WEEK_DAYS=[{id:1,short:"Пн",long:"Понеділок"},{id:2,short:"Вт",long:"Вівторок"},{id:3,short:"Ср",long:"Середа"},{id:4,short:"Чт",long:"Четвер"},{id:5,short:"Пт",long:"П'ятниця"},{id:6,short:"Сб",long:"Субота"},{id:0,short:"Нд",long:"Неділя"}];
const TRAIN_TYPES=[{id:"padel_ind",label:"Падл індивідуальний",color:"#9b8ef4",bg:"rgba(155,142,244,.18)"},{id:"padel_grp",label:"Падл груповий",color:"#f4a23a",bg:"rgba(244,162,58,.18)"},{id:"squash_ind",label:"Сквош індивідуальний",color:"#4a9ef4",bg:"rgba(74,158,244,.18)"},{id:"my_train",label:"Моє тренування",color:"#f46a6a",bg:"rgba(244,106,106,.18)"},{id:"padel_aly",label:"Падл груповий (Alyona)",color:"#f4c53a",bg:"rgba(244,197,58,.18)"}];
const COURTS=[{id:"padel",label:"Падл",color:"#4af0b0"},{id:"squash",label:"Сквош",color:"#4a9ef4"}];
const HOURS=Array.from({length:17},(_,i)=>i+7);
const TODAY=(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;})();
const DAY_NAMES_SHORT=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
const MONTH_NAMES=["Січ","Лют","Бер","Квіт","Трав","Черв","Лип","Серп","Вер","Жовт","Лист","Груд"];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function getStatus(id,sts){const arr=sts||STATUSES;return arr.find(s=>s.id===id)||arr[0];}
function getChannel(id){return CHANNELS.find(c=>c.id===id);}
function getTrainType(id){return TRAIN_TYPES.find(t=>t.id===id)||TRAIN_TYPES[0];}
function getCourt(id){return COURTS.find(c=>c.id===id);}
function getNoteType(id){return NOTE_TYPES.find(t=>t.id===id)||NOTE_TYPES[0];}
function getMembers(g){return(g.members||[]).map(m=>typeof m==="string"?{name:m,paid:{}}:m);}
function formatDate(d){if(!d)return"";const dt=new Date(d+"T00:00:00");return dt.toLocaleDateString("uk-UA",{day:"numeric",month:"short"});}
function getCalendarNames(trainings){const names=new Set();(trainings||[]).forEach(t=>{if(t.player&&t.player.trim())names.add(t.player.trim());(t.players||[]).forEach(p=>{if(p&&p.trim())names.add(p.trim());});});return Array.from(names).sort();}
function toLocalISO(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,"0");const day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`;}
function getWeekDates(offset=0){const now=new Date();const day=now.getDay();const mon=new Date(now);mon.setDate(now.getDate()-((day+6)%7)+offset*7);return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return toLocalISO(d);});}

const card={background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:14,marginBottom:10};
const inp={width:"100%",background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:8,color:"var(--text)",fontFamily:"'DM Sans',sans-serif",fontSize:13,padding:"8px 10px"};

const secTitle={fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:700,letterSpacing:2,color:"var(--accent)",marginBottom:12};
const btnP={padding:"7px 14px",borderRadius:8,border:"none",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600,cursor:"pointer",background:"var(--accent)",color:"var(--bg)"};
const btnG={padding:"7px 14px",borderRadius:8,border:"1px solid var(--border2)",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600,cursor:"pointer",background:"var(--surface2)",color:"var(--text)"};
const btnT={padding:"5px 10px",borderRadius:8,border:"none",fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:600,cursor:"pointer",background:"rgba(74,240,176,.12)",color:"var(--accent2)"};
const btnD={padding:"5px 10px",borderRadius:8,border:"none",fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:600,cursor:"pointer",background:"rgba(255,79,106,.12)",color:"var(--danger)"};
const iconBtn={padding:"5px 8px",borderRadius:8,background:"var(--surface2)",border:"1px solid var(--border2)",color:"var(--muted)",cursor:"pointer",fontSize:13};

function StatusPill({status,statuses}){const s=getStatus(status,statuses);const bg=s.bg||(s.color+"22");return <span style={{padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700,background:bg,color:s.color}}>{s.label}</span>;}
function ChannelChip({channel}){const c=getChannel(channel);if(!c)return null;return <span style={{display:"inline-flex",alignItems:"center",gap:3,padding:"2px 7px",borderRadius:6,fontSize:11,fontWeight:600,background:"var(--surface2)",border:"1px solid var(--border2)",color:c.color}}>{c.emoji} {c.label}</span>;}
function ProgBar({pct,color="var(--accent)",h=6}){return <div style={{height:h,borderRadius:h/2,background:"var(--surface2)",overflow:"hidden"}}><div style={{height:"100%",borderRadius:h/2,background:color,width:Math.min(pct||0,100)+"%",transition:"width .3s"}}/></div>;}
function Empty({icon,text,sub}){return <div style={{textAlign:"center",color:"var(--muted)",padding:"48px 0"}}><div style={{fontSize:36,marginBottom:8}}>{icon}</div><div>{text}</div>{sub&&<div style={{fontSize:12,marginTop:4}}>{sub}</div>}</div>;}
function Row({label,children}){return <div style={{marginBottom:11}}><div style={{fontSize:11,fontWeight:600,color:"var(--muted)",marginBottom:4,letterSpacing:.6,textTransform:"uppercase"}}>{label}</div>{children}</div>;}
function DeleteBtn({onDelete,label="",style:ex}){const [open,setOpen]=useState(false);if(open)return(<div style={{display:"inline-flex",alignItems:"center",gap:6,background:"rgba(255,79,106,.1)",border:"1px solid rgba(255,79,106,.3)",borderRadius:8,padding:"4px 8px"}}><span style={{fontSize:12,color:"var(--danger)",fontWeight:600,whiteSpace:"nowrap"}}>Точно?</span><button onClick={onDelete} style={{padding:"3px 10px",borderRadius:6,border:"none",background:"var(--danger)",color:"#fff",fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:700,cursor:"pointer"}}>Так</button><button onClick={()=>setOpen(false)} style={{padding:"3px 8px",borderRadius:6,border:"1px solid var(--border2)",background:"var(--surface2)",color:"var(--muted)",fontFamily:"'DM Sans',sans-serif",fontSize:11,cursor:"pointer"}}>Ні</button></div>);return <button onClick={()=>setOpen(true)} style={{...btnD,...ex}}>🗑 {label}</button>;}

function App(){
  const [fbReady,setFbReady]=useState(!!window._fbReady);
  const [user,setUser]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const saveTimer=useRef(null);
  const [tab,setTab]=useState("dashboard");
  const [dark,setDark]=useState(()=>lsGet("padel_theme")!=="light");
  const [settings,setSettings]=useState(()=>{const saved=lsGet("padel_settings");if(saved&&saved.trainTypes&&saved.trainTypes.length>0)return saved;return {
    trainTypes:[
      {id:"individual",label:"Індивідуальне тренування",color:"#9b8ef4"},
      {id:"group_train",label:"Групове тренування",color:"#f4a23a"},
      {id:"my_train",label:"Власне тренування",color:"#f46a6a"},
    ],
    courtTypes:[],
    statuses:[
      {id:"lead",label:"Потенційний",color:"#6b7394"},
      {id:"new",label:"Новий",color:"#c8f135"},
      {id:"once",label:"Був 1 раз",color:"#ffb830"},
      {id:"regular",label:"Регулярний",color:"#4af0b0"},
      {id:"group",label:"Хоче в групу",color:"#b07fff"},
      {id:"inactive",label:"Неактивний",color:"#ff4f6a"},
    ],
    levels:["Початківець","Нижче середнього","Середній","Вище середнього","Просунутий"],
    dashBlocks:[{id:"today_trainings",label:"Тренування сьогодні",enabled:true,order:0},{id:"reminders",label:"Нагадування",enabled:true,order:1},{id:"quick_note",label:"Швидка замітка",enabled:true,order:2},{id:"week_stats",label:"Статистика тижня",enabled:false,order:3},{id:"client_activity",label:"Активність клієнтів",enabled:false,order:4},{id:"groups_block",label:"Групи",enabled:false,order:5}],
    channels:[
      {id:"facebook",label:"Facebook",color:"#1877F2"},
      {id:"threads",label:"Threads",color:"#aaa"},
      {id:"instagram",label:"Instagram",color:"#E1306C"},
      {id:"whatsapp",label:"WhatsApp",color:"#25D366"},
      {id:"telegram",label:"Telegram",color:"#229ED9"},
      {id:"personal",label:"Особисто",color:"#c8f135"},
    ],
  }});
  const [showSettings,setShowSettings]=useState(false);
  useEffect(()=>{window._showSettings=()=>setShowSettings(true);},[]);
  const [showSignOut,setShowSignOut]=useState(false);
  const updSettings=(v)=>{setSettings(v);lsSet("padel_settings",v);if(user){clearTimeout(saveTimer.current);saveTimer.current=setTimeout(async()=>{try{await window._fb.save(user.uid,{contacts,groups,courts,trainings,notes,settings:v});}catch(e){console.error(e);}},800);}};
  const [contacts,setContacts]=useState(()=>lsGet("padel_contacts")||[]);
  const [groups,setGroups]=useState(()=>lsGet("padel_groups")||[]);
  const [courts,setCourts]=useState(()=>lsGet("padel_courts")||[]);
  const [trainings,setTrainings]=useState(()=>lsGet("padel_trainings")||[]);
  const [notes,setNotes]=useState(()=>lsGet("padel_notes")||[]);
  const [toast,setToast]=useState("");
  const [modal,setModal]=useState(null);
  const [editItem,setEditItem]=useState(null);
  const [detailId,setDetailId]=useState(null);

  useEffect(()=>{document.body.className=dark?"":"light";lsSet("padel_theme",dark?"dark":"light");},[dark]);
  useEffect(()=>{if(window._fbReady){setFbReady(true);return;}const h=()=>setFbReady(true);window.addEventListener("fbReady",h);return()=>window.removeEventListener("fbReady",h);},[]);
  useEffect(()=>{if(!fbReady)return;const unsub=window._fb.onAuth(u=>{setUser(u);setAuthLoading(false);});return unsub;},[fbReady]);

  useEffect(()=>{
    if(!user)return;
    const unsub=window._fb.listen(user.uid,(data)=>{
      if(data.contacts){setContacts(data.contacts);lsSet("padel_contacts",data.contacts);}
      if(data.groups){setGroups(data.groups);lsSet("padel_groups",data.groups);}
      if(data.courts){setCourts(data.courts);lsSet("padel_courts",data.courts);}
      if(data.trainings){setTrainings(data.trainings);lsSet("padel_trainings",data.trainings);}
      if(data.notes){setNotes(data.notes);lsSet("padel_notes",data.notes);}
      if(data.settings&&data.settings.trainTypes&&data.settings.trainTypes.length>0){setSettings(data.settings);lsSet("padel_settings",data.settings);}
    });
    return unsub;
  },[user]);
  const cloudSave=useCallback((c,g,_p,co,tr,n)=>{if(!user)return;clearTimeout(saveTimer.current);saveTimer.current=setTimeout(async()=>{try{await window._fb.save(user.uid,{contacts:c,groups:g,courts:co,trainings:tr,notes:n,settings:lsGet("padel_settings")||{}});}catch(e){console.error(e);}},800);},[user]);

  const updC=(v)=>{setContacts(v);lsSet("padel_contacts",v);cloudSave(v,groups,[],courts,trainings,notes);};
  const updG=(v)=>{setGroups(v);lsSet("padel_groups",v);cloudSave(contacts,v,[],courts,trainings,notes);};
  const updCo=(v)=>{setCourts(v);lsSet("padel_courts",v);cloudSave(contacts,groups,[],v,trainings,notes);};
  const updTr=(v)=>{setTrainings(v);lsSet("padel_trainings",v);cloudSave(contacts,groups,[],courts,v,notes);};

function TrainingStats({trainings}){
  const [weekOffset,setWeekOffset]=useState(0);

  // Get week dates for a given offset (Mon-Sun)
  function getWeek(offset){
    const now=new Date();
    const day=now.getDay();
    const mon=new Date(now);
    mon.setDate(now.getDate()-((day+6)%7)+offset*7);
    const dates=[];
    for(let i=0;i<7;i++){
      const d=new Date(mon);
      d.setDate(mon.getDate()+i);
      dates.push(toLocalISO(d));
    }
    return dates;
  }

  // Count trainings for a week
  function countForWeek(offset){
    const dates=getWeek(offset);
    const s=dates[0],e=dates[6];
    return trainings.filter(t=>t.date>=s&&t.date<=e).length;
  }

  // Build last 8 weeks data
  const weeks=Array.from({length:8},(_,i)=>{
    const off=weekOffset-7+i; // older to newer
    const dates=getWeek(off);
    const mon=new Date(dates[0]+"T00:00:00");
    const sun=new Date(dates[6]+"T00:00:00");
    const label=mon.getDate()+" "+MONTH_NAMES[mon.getMonth()];
    const count=trainings.filter(t=>t.date>=dates[0]&&t.date<=dates[6]).length;
    const isCurrent=off===0;
    return {off,label,count,isCurrent};
  });

  const currentWeekDates=getWeek(weekOffset);
  const currentWeekTrainings=trainings.filter(t=>t.date>=currentWeekDates[0]&&t.date<=currentWeekDates[6]);
  const currentCount=currentWeekTrainings.length;
  const maxCount=Math.max(...weeks.map(w=>w.count),1);

  // Group current week by day
  const DAY_SHORT=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
  const byDay=currentWeekDates.map((date,i)=>{
    const count=trainings.filter(t=>t.date===date).length;
    const isToday=date===TODAY;
    return {date,day:DAY_SHORT[i],count,isToday};
  });

  const weekLabel=(()=>{
    const d0=new Date(currentWeekDates[0]+"T00:00:00");
    const d6=new Date(currentWeekDates[6]+"T00:00:00");
    const s=d0.getDate()+" "+MONTH_NAMES[d0.getMonth()];
    const e=d6.getDate()+" "+MONTH_NAMES[d6.getMonth()];
    return s+" – "+e;
  })();

  return(
    <div style={card}>
      {/* Header with navigation */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <span style={{fontWeight:600,fontSize:14}}>
          Тренувань за тиждень
        </span>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <button style={iconBtn} onClick={()=>setWeekOffset(w=>w-1)}>‹</button>
          <span style={{fontSize:12,color:"var(--muted)",minWidth:140,textAlign:"center"}}>{weekOffset===0?"Цей тиждень":weekLabel}</span>
          <button style={{...iconBtn,opacity:weekOffset>=0?".4":"1"}} onClick={()=>weekOffset<0&&setWeekOffset(w=>w+1)} disabled={weekOffset>=0}>›</button>
          {weekOffset!==0&&<button style={{...btnG,fontSize:11,padding:"3px 8px"}} onClick={()=>setWeekOffset(0)}>Зараз</button>}
        </div>
      </div>

      {/* Current week big number + day breakdown */}
      <div style={{display:"flex",alignItems:"flex-end",gap:16,marginBottom:14}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:52,fontWeight:700,
            color:"var(--accent)",lineHeight:1}}>{currentCount}</div>
          <div style={{fontSize:11,color:"var(--muted)"}}>тренувань</div>
        </div>

        {/* Day-by-day mini bars */}
        <div style={{flex:1,display:"flex",alignItems:"flex-end",gap:4,height:56}}>
          {byDay.map(d=>{
            const h=d.count>0?Math.max(8,Math.round(d.count/Math.max(...byDay.map(x=>x.count),1)*48)):3;
            return(
              <div key={d.date} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                <div style={{width:"100%",height:h,borderRadius:3,
                  background:d.isToday?"var(--accent)":d.count>0?"var(--accent2)":"var(--border2)",
                  minHeight:3,transition:"height .3s"}}/>
                <div style={{fontSize:9,color:d.isToday?"var(--accent)":"var(--muted)",fontWeight:d.isToday?700:400}}>{d.day}</div>
                {d.count>0&&<div style={{fontSize:9,color:"var(--accent2)",fontWeight:700}}>{d.count}</div>}
              </div>
            );
          })}
        </div>
      </div>

      {/* 8-week chart */}
      <div style={{borderTop:"1px solid var(--border)",paddingTop:10}}>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:8,fontWeight:600,letterSpacing:.4,textTransform:"uppercase"}}>Останні 8 тижнів</div>
        <div style={{display:"flex",alignItems:"flex-end",gap:3,height:60}}>
          {weeks.map((w,i)=>{
            const h=w.count>0?Math.max(6,Math.round(w.count/maxCount*52)):3;
            return(
              <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer"}}
                onClick={()=>setWeekOffset(w.off)}>
                <div style={{width:"100%",borderRadius:"3px 3px 0 0",
                  background:w.isCurrent?"var(--accent)":w.count>0?"rgba(74,240,176,.5)":"var(--border)",
                  height:h,transition:"height .3s",minHeight:3,
                  outline:w.off===weekOffset&&!w.isCurrent?"2px solid var(--accent2)":"none"}}/>
                <div style={{fontSize:8,color:w.isCurrent?"var(--accent)":"var(--muted)",
                  fontWeight:w.isCurrent?700:400,whiteSpace:"nowrap"}}>{w.label}</div>
                {w.count>0&&<div style={{fontSize:8,color:w.isCurrent?"var(--accent)":"var(--accent2)",fontWeight:600}}>{w.count}</div>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function Contacts({contacts,onUpdate,onOpen,onDetail,settings,showToast}){
  const [search,setSearch]=useState("");
  const [fSt,setFSt]=useState("all");
  const [fLvl,setFLvl]=useState("all");
  const filtered=contacts.filter(c=>{const ms=c.name.toLowerCase().includes(search.toLowerCase())||(c.note||"").toLowerCase().includes(search.toLowerCase())||(c.contact||"").includes(search);return ms&&(fSt==="all"||c.status===fSt)&&(fLvl==="all"||c.level===fLvl);});
  const del=(id)=>{onUpdate(contacts.filter(c=>c.id!==id));showToast("Видалено");};
  const markW=(id)=>{onUpdate(contacts.map(c=>c.id===id?{...c,remindDone:true,remindDate:null}:c));showToast("Позначено ✓");};
  return(
    <div>
      <div style={secTitle}>КОНТАКТИ <span style={{color:"var(--muted)",fontSize:16}}>({filtered.length})</span></div>
      <div style={{position:"relative",marginBottom:12}}><span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"var(--muted)",fontSize:13,pointerEvents:"none"}}>🔍</span><input style={{...inp,paddingLeft:32}} placeholder="Пошук по імені, нотатці, телефону..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
        <button style={fSt==="all"?fOn:fOff} onClick={()=>setFSt("all")}>Всі ({contacts.length})</button>
        {(settings?.statuses||STATUSES).map(s=>{const cnt=contacts.filter(c=>c.status===s.id).length;if(!cnt)return null;return <button key={s.id} style={fSt===s.id?fOn:fOff} onClick={()=>setFSt(s.id)}>{s.label} ({cnt})</button>;})}
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12,alignItems:"center"}}>
        <span style={{fontSize:11,color:"var(--muted)",fontWeight:600,letterSpacing:.4}}>Рівень:</span>
        <button style={fLvl==="all"?fOn:fOff} onClick={()=>setFLvl("all")}>Всі</button>
        {(settings?.levels||LEVELS).map(l=>{const cnt=contacts.filter(c=>c.level===l).length;if(!cnt)return null;return <button key={l} style={fLvl===l?fOn:fOff} onClick={()=>setFLvl(l)}>{l} ({cnt})</button>;})}
      </div>
      {filtered.length===0&&<Empty icon="👥" text="Контактів не знайдено" sub="Натисни + щоб додати"/>}
      {filtered.map(c=>(
        <div key={c.id} style={card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
            <div style={{flex:1,cursor:"pointer"}} onClick={()=>onDetail(c)}><div style={{fontWeight:600,fontSize:15}}>{c.name}</div><div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:4,alignItems:"center"}}><StatusPill status={c.status}/>{c.channels?.map(ch=><ChannelChip key={ch} channel={ch}/>)}{c.level&&<span style={{color:"var(--muted)",fontSize:11}}>· {c.level}</span>}</div></div>
            <button style={iconBtn} onClick={()=>onOpen(c)}>✏️</button>
          </div>
          {c.note&&<div style={{marginTop:8,fontSize:13,color:"var(--text2)",lineHeight:1.55,cursor:"pointer"}} onClick={()=>onDetail(c)}>{c.note.slice(0,120)}{c.note.length>120?"...":""}</div>}
          {c.remindDate&&!c.remindDone&&<div style={{display:"inline-flex",alignItems:"center",gap:4,background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:6,padding:"3px 8px",fontSize:11,color:c.remindDate<=TODAY?"var(--danger)":"var(--warn)",marginTop:5}}>🔔 {c.remindDate<=TODAY?"⚠️ Написати!":"Написати: "+formatDate(c.remindDate)}</div>}
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}>
            {c.chatLink&&(()=>{
              const pl=CHAT_PLATFORMS.find(p=>c.chatLink.startsWith(p.base));
              return <a href={c.chatLink} target="_blank" rel="noreferrer"
                style={{...btnT,textDecoration:"none",fontSize:11,padding:"5px 12px"}}>
                {pl?pl.label+" →":"Чат →"}
              </a>;
            })()}
            {c.remindDate&&!c.remindDone&&<button style={btnT} onClick={()=>markW(c.id)}>✅ Написав</button>}
            <DeleteBtn onDelete={()=>del(c.id)} label=""/>
          </div>
        </div>
      ))}
    </div>
  );
}

function ContactDetail({id,contacts,onClose,onEdit,onUpdate,showToast,settings}){
  const [activeTab,setActiveTab]=useState("main");
  const [addingTab,setAddingTab]=useState(false);
  const [newTabName,setNewTabName]=useState("");
  const [newTabType,setNewTabType]=useState("fields");
  const [newNote,setNewNote]=useState("");
  const [newEntry,setNewEntry]=useState("");
  const [newEntryKey,setNewEntryKey]=useState("");

  const c=contacts.find(x=>x.id===id);
  if(!c)return null;

  const templateTabs=settings?.contactTabTemplates||[
    {id:"main",label:"Основна",type:"main",removable:false},
    {id:"history",label:"Історія",type:"history",removable:false},
  ];
  const contactTabs=c.customTabs||[];
  const allTabs=[...templateTabs,...contactTabs];

  const addContactTab=()=>{
    if(!newTabName.trim())return;
    const tab={id:uid(),label:newTabName.trim(),type:newTabType,removable:true,data:[]};
    onUpdate(contacts.map(x=>x.id===id?{...x,customTabs:[...(x.customTabs||[]),tab]}:x));
    setNewTabName("");setAddingTab(false);setActiveTab(tab.id);
  };
  const removeContactTab=(tabId)=>{
    onUpdate(contacts.map(x=>x.id===id?{...x,customTabs:(x.customTabs||[]).filter(t=>t.id!==tabId)}:x));
    setActiveTab("main");
  };
  const addNote=()=>{
    if(!newNote.trim())return;
    const h=c.history||[];
    onUpdate(contacts.map(x=>x.id===id?{...x,history:[...h,{id:uid(),date:TODAY,text:newNote.trim(),channel:c.channels?.[0]||""}]}:x));
    setNewNote("");showToast("Додано");
  };
  const delNote=(hid)=>onUpdate(contacts.map(x=>x.id===id?{...x,history:(x.history||[]).filter(h=>h.id!==hid)}:x));
  const addTabEntry=(tabId,entry)=>onUpdate(contacts.map(x=>x.id===id?{...x,customTabs:(x.customTabs||[]).map(t=>t.id===tabId?{...t,data:[...(t.data||[]),entry]}:t)}:x));
  const delTabEntry=(tabId,entryId)=>onUpdate(contacts.map(x=>x.id===id?{...x,customTabs:(x.customTabs||[]).map(t=>t.id===tabId?{...t,data:(t.data||[]).filter(e=>e.id!==entryId)}:t)}:x));
  const toggleTabEntry=(tabId,entryId)=>onUpdate(contacts.map(x=>x.id===id?{...x,customTabs:(x.customTabs||[]).map(t=>t.id===tabId?{...t,data:(t.data||[]).map(e=>e.id===entryId?{...e,done:!e.done}:e)}:t)}:x));

  const currentTab=allTabs.find(t=>t.id===activeTab)||allTabs[0];

  return(
    <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={modal}>
        <div style={modalTitle}>
          <span>{c.name}</span>
          <div style={{display:"flex",gap:8}}>
            <button style={btnG} onClick={onEdit}>&#9999;</button>
            <button style={{background:"none",border:"none",color:"var(--muted)",fontSize:20,cursor:"pointer"}} onClick={onClose}>&#x2715;</button>
          </div>
        </div>

        {/* Tab navigation */}
        <div style={{display:"flex",gap:4,overflowX:"auto",marginBottom:12,marginTop:4,
          borderBottom:"1px solid var(--border)",paddingBottom:8}}>
          {allTabs.map(tab=>(
            <button key={tab.id} onClick={()=>setActiveTab(tab.id)}
              style={{padding:"4px 12px",borderRadius:20,
                border:`1px solid ${activeTab===tab.id?"var(--accent)":"var(--border2)"}`,
                background:activeTab===tab.id?"rgba(200,241,53,.1)":"var(--surface2)",
                color:activeTab===tab.id?"var(--accent)":"var(--muted)",
                fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600,
                cursor:"pointer",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:4}}>
              {tab.label}
              {tab.removable&&<span onClick={e=>{e.stopPropagation();removeContactTab(tab.id);}}
                style={{fontSize:10,opacity:.6}}>&#x2715;</span>}
            </button>
          ))}
          {!addingTab&&(
            <button onClick={()=>setAddingTab(true)}
              style={{padding:"4px 10px",borderRadius:20,border:"1px dashed var(--border2)",
                background:"transparent",color:"var(--muted)",fontFamily:"'DM Sans',sans-serif",
                fontSize:12,cursor:"pointer",whiteSpace:"nowrap"}}>
              + Вкладка
            </button>
          )}
        </div>

        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
          <StatusPill status={c.status}/>
          {c.channels?.map(ch=><ChannelChip key={ch} channel={ch}/>)}
        </div>
        {c.level&&<div style={{color:"var(--text2)",fontSize:13,marginBottom:4}}>{c.level}</div>}
        {c.contact&&<div style={{color:"var(--accent2)",fontSize:13,marginBottom:4}}>&#128241; {c.contact}</div>}
        {c.chatLink&&(()=>{
          const pl=CHAT_PLATFORMS.find(p=>c.chatLink.startsWith(p.base));
          return(<a href={c.chatLink} target="_blank" rel="noreferrer"
            style={{display:"inline-flex",alignItems:"center",gap:6,color:"#4a9ef4",fontSize:13,
              marginBottom:8,textDecoration:"none",padding:"4px 10px",
              background:"rgba(74,158,244,.1)",borderRadius:8,border:"1px solid rgba(74,158,244,.25)"}}>
            {pl?pl.label+" →":"Перейти в чат"}
          </a>);
        })()}

        {/* Add tab form */}
        {addingTab&&(
          <div style={{...card,marginBottom:12}}>
            <div style={{display:"flex",gap:6,marginBottom:6}}>
              <input style={{...inp,flex:1}} placeholder="Назва вкладки..."
                value={newTabName} onChange={e=>setNewTabName(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&addContactTab()}/>
              <select style={{...inp,width:130}} value={newTabType} onChange={e=>setNewTabType(e.target.value)}>
                <option value="fields">Поля</option>
                <option value="records">Записи</option>
                <option value="checklist">Список</option>
                <option value="text">Текст</option>
              </select>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button style={{...btnP,flex:1}} onClick={addContactTab}>Додати</button>
              <button style={btnG} onClick={()=>setAddingTab(false)}>Скасувати</button>
            </div>
          </div>
        )}

        {/* Main tab */}
        {currentTab?.type==="main"&&(
          <div>
            {c.note&&<div style={{marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:600,color:"var(--muted)",textTransform:"uppercase",letterSpacing:.6,marginBottom:6}}>Нотатка</div>
              <div style={{background:"var(--surface2)",borderRadius:8,padding:10,color:"var(--text2)",fontSize:13,lineHeight:1.55}}>{c.note}</div>
            </div>}
            {c.remindDate&&!c.remindDone&&(
              <div style={{background:"rgba(255,184,48,.08)",border:"1px solid rgba(255,184,48,.2)",borderRadius:8,padding:10}}>
                <span style={{color:"var(--warn)",fontSize:13,fontWeight:600}}>&#128276; Написати: {formatDate(c.remindDate)}</span>
              </div>
            )}
          </div>
        )}

        {/* History tab */}
        {currentTab?.type==="history"&&(
          <div>
            {(!c.history||!c.history.length)&&<div style={{color:"var(--muted)",fontSize:12,marginBottom:10}}>Поки нічого немає</div>}
            {(c.history||[]).map(h=>(
              <div key={h.id} style={{padding:"8px 10px",borderRadius:8,background:"var(--surface2)",border:"1px solid var(--border)",marginBottom:6}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--muted)",marginBottom:3}}>
                  <span>{formatDate(h.date)}</span>
                  <DeleteBtn onDelete={()=>delNote(h.id)} label=""/>
                </div>
                <div style={{fontSize:13,color:"var(--text2)"}}>{h.text}</div>
              </div>
            ))}
            <div style={{display:"flex",gap:6,marginTop:8}}>
              <textarea style={{...inp,minHeight:48,flex:1}} placeholder="Додати запис..."
                value={newNote} onChange={e=>setNewNote(e.target.value)}/>
              <button style={{...btnP,alignSelf:"flex-end"}} onClick={addNote}>+</button>
            </div>
          </div>
        )}

        {/* Custom tabs */}
        {currentTab?.removable&&(()=>{
          const tabData=contactTabs.find(t=>t.id===currentTab.id);
          if(!tabData)return null;
          const entries=tabData.data||[];

          if(tabData.type==="fields")return(
            <div>
              {entries.map(e=>(
                <div key={e.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid var(--border)"}}>
                  <span style={{fontSize:12,color:"var(--muted)",width:120,flexShrink:0}}>{e.key}</span>
                  <span style={{fontSize:13,flex:1}}>{e.value}</span>
                  <DeleteBtn onDelete={()=>delTabEntry(currentTab.id,e.id)} label=""/>
                </div>
              ))}
              <div style={{display:"flex",gap:6,marginTop:8}}>
                <input style={{...inp,width:100}} placeholder="Назва" value={newEntryKey} onChange={e=>setNewEntryKey(e.target.value)}/>
                <input style={{...inp,flex:1}} placeholder="Значення" value={newEntry} onChange={e=>setNewEntry(e.target.value)}
                  onKeyDown={e=>{if(e.key==="Enter"&&newEntryKey.trim()&&newEntry.trim()){addTabEntry(currentTab.id,{id:uid(),key:newEntryKey.trim(),value:newEntry.trim()});setNewEntry("");setNewEntryKey("");}}}/>
                <button style={btnP} onClick={()=>{if(newEntryKey.trim()&&newEntry.trim()){addTabEntry(currentTab.id,{id:uid(),key:newEntryKey.trim(),value:newEntry.trim()});setNewEntry("");setNewEntryKey("");}}}>+</button>
              </div>
            </div>
          );

          if(tabData.type==="records")return(
            <div>
              {entries.map(e=>(
                <div key={e.id} style={{padding:"8px 10px",borderRadius:8,background:"var(--surface2)",border:"1px solid var(--border)",marginBottom:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--muted)",marginBottom:3}}>
                    <span>{formatDate(e.date)}</span>
                    <DeleteBtn onDelete={()=>delTabEntry(currentTab.id,e.id)} label=""/>
                  </div>
                  <div style={{fontSize:13}}>{e.text}</div>
                </div>
              ))}
              <div style={{display:"flex",gap:6,marginTop:8}}>
                <textarea style={{...inp,minHeight:48,flex:1}} placeholder="Новий запис..."
                  value={newEntry} onChange={e=>setNewEntry(e.target.value)}/>
                <button style={{...btnP,alignSelf:"flex-end"}} onClick={()=>{if(newEntry.trim()){addTabEntry(currentTab.id,{id:uid(),date:TODAY,text:newEntry.trim()});setNewEntry("");}}}>+</button>
              </div>
            </div>
          );

          if(tabData.type==="checklist")return(
            <div>
              {entries.map(e=>(
                <div key={e.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:"1px solid var(--border)"}}>
                  <button onClick={()=>toggleTabEntry(currentTab.id,e.id)}
                    style={{width:20,height:20,borderRadius:4,border:`2px solid ${e.done?"var(--accent2)":"var(--border2)"}`,
                      background:e.done?"rgba(74,240,176,.15)":"var(--surface2)",cursor:"pointer",
                      display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:11,color:"var(--accent2)"}}>
                    {e.done&&"✓"}
                  </button>
                  <span style={{flex:1,fontSize:13,textDecoration:e.done?"line-through":"none",color:e.done?"var(--muted)":"var(--text)"}}>{e.text}</span>
                  <DeleteBtn onDelete={()=>delTabEntry(currentTab.id,e.id)} label=""/>
                </div>
              ))}
              <div style={{display:"flex",gap:6,marginTop:8}}>
                <input style={{...inp,flex:1}} placeholder="Новий пункт..." value={newEntry}
                  onChange={e=>setNewEntry(e.target.value)}
                  onKeyDown={e=>{if(e.key==="Enter"&&newEntry.trim()){addTabEntry(currentTab.id,{id:uid(),text:newEntry.trim(),done:false});setNewEntry("");}}}/>
                <button style={btnP} onClick={()=>{if(newEntry.trim()){addTabEntry(currentTab.id,{id:uid(),text:newEntry.trim(),done:false});setNewEntry("");}}}>+</button>
              </div>
            </div>
          );

          if(tabData.type==="text")return(
            <textarea style={{...inp,minHeight:150}} placeholder="Вільний текст..."
              value={entries[0]?.text||""}
              onChange={e=>{const text=e.target.value;onUpdate(contacts.map(x=>x.id===id?{...x,customTabs:(x.customTabs||[]).map(t=>t.id===currentTab.id?{...t,data:[{id:"text",text}]}:t)}:x));}}/>
          );
          return null;
        })()}
      </div>
    </div>
  );
}


function ContactModal({item,contacts,settings,onClose,onSave}){
  const [form,setForm]=useState(item||{id:uid(),name:"",channels:[],status:"new",level:"",note:"",contact:"",remindDate:"",remindDone:false,history:[]});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const tgCh=(id)=>set("channels",(form.channels||[]).includes(id)?(form.channels||[]).filter(c=>c!==id):[...(form.channels||[]),id]);
  const save=()=>{if(!form.name.trim()){alert("Введи ім'я!");return;}onSave(item?contacts.map(c=>c.id===item.id?{...form}:c):[{...form},...contacts]);};
  return(
    <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={modal}>
        <div style={modalTitle}><span>{item?"Редагувати":"Новий контакт"}</span><button style={{background:"none",border:"none",color:"var(--muted)",fontSize:20,cursor:"pointer"}} onClick={onClose}>✕</button></div>
        <Row label="Ім'я *"><input style={inp} placeholder="Ім'я та прізвище" value={form.name} onChange={e=>set("name",e.target.value)}/></Row>
        <Row label="Де спілкуємось"><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{(settings?.channels||CHANNELS).map(ch=>{const s=(form.channels||[]).includes(ch.id);return <button key={ch.id} onClick={()=>tgCh(ch.id)} style={{padding:"6px 12px",borderRadius:8,border:`1px solid ${s?ch.color:"var(--border2)"}`,background:s?"rgba(200,241,53,.08)":"var(--surface2)",color:s?ch.color:"var(--muted)",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600,cursor:"pointer"}}>{ch.label}</button>;})}</div></Row>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><Row label="Статус"><select style={inp} value={form.status} onChange={e=>set("status",e.target.value)}>{(settings?.statuses||STATUSES).map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select></Row><Row label="Рівень"><select style={inp} value={form.level} onChange={e=>set("level",e.target.value)}><option value="">Невідомо</option>{(settings?.levels||LEVELS).map(l=><option key={l}>{l}</option>)}</select></Row></div>
        <Row label="Нотатка"><textarea style={{...inp,minHeight:64}} placeholder="Хоче групове, жде набору..." value={form.note} onChange={e=>set("note",e.target.value)}/></Row>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><Row label="Телефон / Нікнейм"><input style={inp} placeholder="+380..." value={form.contact} onChange={e=>set("contact",e.target.value)}/></Row><Row label="Написати до"><input style={inp} type="date" value={form.remindDate} onChange={e=>{set("remindDate",e.target.value);set("remindDone",false);}}/></Row></div>
        <ChatLinkPicker value={form.chatLink||""} onChange={v=>set("chatLink",v)}/>
        <div style={{display:"flex",gap:8,marginTop:4}}><button style={{...btnP,flex:1}} onClick={save}>Зберегти</button><button style={btnG} onClick={onClose}>Скасувати</button></div>
      </div>
    </div>
  );
}

function Reminders({contacts,onUpdate,notes,onUpdateNotes,showToast,onDetail,onOpenNoteModal}){
  const withR=contacts.filter(c=>c.remindDate&&!c.remindDone).sort((a,b)=>a.remindDate.localeCompare(b.remindDate));
  const withNR=(notes||[]).filter(n=>n.remindDate&&!n.remindDone).sort((a,b)=>a.remindDate.localeCompare(b.remindDate));
  const tagged=(arr,kind)=>arr.map(x=>({...x,_kind:kind}));
  const merge=(a,b)=>[...tagged(a,"contact"),...tagged(b,"note")].sort((x,y)=>x.remindDate.localeCompare(y.remindDate));
  const allOverdue=merge(withR.filter(c=>c.remindDate<TODAY),withNR.filter(n=>n.remindDate<TODAY));
  const allToday=merge(withR.filter(c=>c.remindDate===TODAY),withNR.filter(n=>n.remindDate===TODAY));
  const allUpcoming=merge(withR.filter(c=>c.remindDate>TODAY),withNR.filter(n=>n.remindDate>TODAY));
  const total=allOverdue.length+allToday.length+allUpcoming.length;
  const markContactDone=(id)=>{onUpdate(contacts.map(c=>c.id===id?{...c,remindDone:true,remindDate:null}:c));showToast("Позначено ✓");};
  const markNoteDone=(id)=>{onUpdateNotes((notes||[]).map(n=>n.id===id?{...n,remindDone:true}:n));showToast("Позначено ✓");};
  const ItemCard=({item,color})=>{
    const isNote=item._kind==="note";
    const nt=isNote?getNoteType(item.type):null;
    return(
      <div style={{display:"flex",alignItems:"flex-start",gap:10,padding:11,borderRadius:10,border:`1px solid ${color}30`,background:`${color}08`,marginBottom:8}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            {isNote&&<span style={{fontSize:14}}>{nt.emoji}</span>}
            <span style={{fontWeight:600,fontSize:14,cursor:"pointer",color:"var(--text)"}} onClick={()=>!isNote&&onDetail(item)}>{isNote?(item.title||"Замітка"):item.name}</span>
            {isNote?<span style={{padding:"1px 7px",borderRadius:12,fontSize:10,fontWeight:700,background:`${nt.color}18`,color:nt.color}}>{nt.label}</span>:<StatusPill status={item.status}/>}
          </div>
          {!isNote&&item.channels?.length>0&&<div style={{display:"flex",gap:4,marginTop:4}}>{item.channels.map(ch=><ChannelChip key={ch} channel={ch}/>)}</div>}
          {isNote&&item.body&&<div style={{color:"var(--text2)",fontSize:12,marginTop:4,lineHeight:1.4}}>{item.body.slice(0,80)}</div>}
          {!isNote&&item.note&&<div style={{color:"var(--text2)",fontSize:12,marginTop:4}}>{item.note.slice(0,80)}</div>}
          <div style={{color,fontSize:10,marginTop:3,fontWeight:600}}>{formatDate(item.remindDate)}</div>
        </div>
        <button style={btnT} onClick={()=>isNote?markNoteDone(item.id):markContactDone(item.id)}>✅</button>
      </div>
    );
  };
  const Sec=({items,color,title})=>{if(!items.length)return null;return(<><div style={{color,fontWeight:700,fontSize:12,letterSpacing:1,marginBottom:8}}>{title} ({items.length})</div>{items.map(item=><ItemCard key={item.id+(item._kind||"")} item={item} color={color}/>)}<div style={{height:1,background:"var(--border)",margin:"14px 0"}}/></>);};
  const [quickText,setQuickText]=useState("");
  const [quickDate,setQuickDate]=useState(TODAY);
  const addQuickReminder=()=>{
    if(!quickText.trim())return;
    const newNote={
      id:uid(),type:"todo",title:quickText.trim(),body:"",
      remindDate:quickDate,remindDone:false,
      contactIds:[],extraNames:[],pinned:false,done:false,createdAt:Date.now()
    };
    onUpdateNotes([...(notes||[]),newNote]);
    setQuickText("");
    setQuickDate(TODAY);
    showToast("Нагадування додано ✓");
  };

  return(
    <div>
      <div style={secTitle}>НАГАДУВАННЯ <span style={{color:"var(--muted)",fontSize:16}}>({total})</span></div>

      {/* Quick add reminder */}
      <div style={{...card,borderColor:"rgba(200,241,53,.2)",marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,color:"var(--accent)",textTransform:"uppercase",letterSpacing:.6,marginBottom:8}}>+ Нове нагадування</div>
        <input style={{...inp,marginBottom:8}} placeholder="Що потрібно зробити або написати..." value={quickText} onChange={e=>setQuickText(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&addQuickReminder()}/>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <input type="date" style={{...inp,flex:1,minWidth:140}} value={quickDate} onChange={e=>setQuickDate(e.target.value)}/>
          <div style={{display:"flex",gap:5}}>
            {[{l:"Сьогодні",d:0},{l:"Завтра",d:1},{l:"+7 днів",d:7}].map(({l,d})=>{
              const dt=new Date();dt.setDate(dt.getDate()+d);
              const v=toLocalISO(dt);
              return <button key={l} style={{...btnG,fontSize:11,padding:"5px 8px",
                borderColor:quickDate===v?"var(--accent)":"var(--border2)",
                color:quickDate===v?"var(--accent)":"var(--muted)"}}
                onClick={()=>setQuickDate(v)}>{l}</button>;
            })}
          </div>
          <button style={{...btnP,padding:"7px 16px",flexShrink:0}} onClick={addQuickReminder}>Додати</button>
        </div>
      </div>

      {!total&&<Empty icon="🎉" text="Нагадувань немає!" sub="Ти всім написав."/>}
      <Sec items={allOverdue} color="#ff4f6a" title="⚠️ ПРОСТРОЧЕНО"/>
      <Sec items={allToday} color="#ffb830" title="🔥 СЬОГОДНІ"/>
      <Sec items={allUpcoming} color="#4af0b0" title="📅 ЗАПЛАНОВАНО"/>
    </div>
  );
}

function Notes({notes,contacts,onUpdate,showToast}){
  const [filter,setFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [editNote,setEditNote]=useState(null);
  const filtered=notes.filter(n=>{
    const mf=filter==="all"||n.type===filter||(filter==="due"&&n.remindDate&&n.remindDate<=TODAY&&!n.remindDone);
    const ms=!search||(n.title||"").toLowerCase().includes(search.toLowerCase())||(n.body||"").toLowerCase().includes(search.toLowerCase());
    return mf&&ms;
  }).sort((a,b)=>{if(a.pinned&&!b.pinned)return -1;if(!a.pinned&&b.pinned)return 1;return(b.createdAt||0)-(a.createdAt||0);});
  const del=(id)=>{onUpdate(notes.filter(n=>n.id!==id));showToast("Видалено");};
  const toggleDone=(id)=>{onUpdate(notes.map(n=>n.id===id?{...n,done:!n.done}:n));};
  const togglePin=(id)=>{onUpdate(notes.map(n=>n.id===id?{...n,pinned:!n.pinned}:n));};
  const markRemindDone=(id)=>{onUpdate(notes.map(n=>n.id===id?{...n,remindDone:true}:n));showToast("Нагадування знято ✓");};
  const dueCount=notes.filter(n=>n.remindDate&&n.remindDate<=TODAY&&!n.remindDone).length;
  return(
    <div>
      <div style={secTitle}>ЗАМІТКИ <span style={{color:"var(--muted)",fontSize:16}}>({notes.length})</span></div>
      <div style={{position:"relative",marginBottom:12}}><span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"var(--muted)",fontSize:13,pointerEvents:"none"}}>🔍</span><input style={{...inp,paddingLeft:32}} placeholder="Пошук по замітках..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
        <button style={filter==="all"?fOn:fOff} onClick={()=>setFilter("all")}>Всі ({notes.length})</button>
        {dueCount>0&&<button style={filter==="due"?{...fOn,borderColor:"#b07fff",color:"#b07fff"}:fOff} onClick={()=>setFilter("due")}>🔔 Нагадування ({dueCount})</button>}
        {NOTE_TYPES.map(t=>{const cnt=notes.filter(n=>n.type===t.id).length;if(!cnt)return null;return <button key={t.id} style={filter===t.id?fOn:fOff} onClick={()=>setFilter(t.id)}>{t.emoji} {t.label} ({cnt})</button>;})}
      </div>
      {filtered.length===0&&<Empty icon="📝" text="Заміток немає" sub="Натисни + щоб додати"/>}
      {filtered.map(n=>{
        const nt=getNoteType(n.type);
        const overdue=n.remindDate&&n.remindDate<TODAY&&!n.remindDone;
        const dueToday=n.remindDate&&n.remindDate===TODAY&&!n.remindDone;
        const linkedContacts=(n.contactIds||[]).map(id=>contacts.find(c=>c.id===id)).filter(Boolean);
        return(
          <div key={n.id} style={{...card,borderColor:n.pinned?"rgba(200,241,53,.3)":overdue?"rgba(255,79,106,.25)":dueToday?"rgba(255,184,48,.25)":"var(--border)",opacity:n.done?.5:1}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
              <span style={{fontSize:16,flexShrink:0,marginTop:1}}>{nt.emoji}</span>
              <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>setEditNote(n)}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  {n.pinned&&<span style={{fontSize:10,color:"var(--accent)"}}>📌</span>}
                  <span style={{fontWeight:600,fontSize:15,color:n.done?"var(--muted)":"var(--text)",textDecoration:n.done?"line-through":"none"}}>{n.title||"Без назви"}</span>
                  <span style={{padding:"1px 7px",borderRadius:12,fontSize:10,fontWeight:700,background:`${nt.color}18`,color:nt.color}}>{nt.label}</span>
                </div>
                {n.body&&<div style={{fontSize:13,color:"var(--text2)",marginTop:4,lineHeight:1.5,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{n.body}</div>}
              </div>
              <div style={{display:"flex",gap:4,flexShrink:0}}>
                <button onClick={()=>togglePin(n.id)} style={{...iconBtn,color:n.pinned?"var(--accent)":"var(--muted)"}}>📌</button>
                <button onClick={()=>setEditNote(n)} style={iconBtn}>✏️</button>
              </div>
            </div>
            {n.remindDate&&!n.remindDone&&(
              <div style={{display:"inline-flex",alignItems:"center",gap:6,marginTop:8,padding:"4px 10px",borderRadius:8,background:overdue?"rgba(255,79,106,.1)":dueToday?"rgba(255,184,48,.1)":"rgba(74,240,176,.08)",border:`1px solid ${overdue?"rgba(255,79,106,.3)":dueToday?"rgba(255,184,48,.3)":"rgba(74,240,176,.2)"}`}}>
                <span style={{fontSize:11,color:overdue?"var(--danger)":dueToday?"var(--warn)":"var(--accent2)",fontWeight:600}}>🔔 {overdue?"⚠️ Прострочено":dueToday?"Сьогодні":formatDate(n.remindDate)}</span>
                <button onClick={()=>markRemindDone(n.id)} style={{background:"none",border:"none",color:"var(--accent2)",cursor:"pointer",fontSize:11,fontWeight:700,padding:0}}>✓ Знято</button>
              </div>
            )}
            {(linkedContacts.length>0||(n.extraNames||[]).filter(Boolean).length>0)&&(
              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:8}}>
                {linkedContacts.map(c=>(<span key={c.id} style={{padding:"2px 8px",borderRadius:12,fontSize:11,fontWeight:600,background:"var(--surface2)",border:"1px solid var(--border2)",color:"var(--text2)"}}>👤 {c.name}</span>))}
                {(n.extraNames||[]).filter(Boolean).map((name,i)=>(<span key={"ex"+i} style={{padding:"2px 8px",borderRadius:12,fontSize:11,fontWeight:600,background:"rgba(74,158,244,.1)",border:"1px solid rgba(74,158,244,.3)",color:"#4a9ef4"}}>👤 {name}</span>))}
              </div>
            )}
            <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>
              <button onClick={()=>toggleDone(n.id)} style={{...btnT,fontSize:11,padding:"4px 10px",background:n.done?"rgba(107,115,148,.15)":"rgba(74,240,176,.12)",color:n.done?"var(--muted)":"var(--accent2)"}}>{n.done?"↩ Відновити":"✓ Виконано"}</button>
              <DeleteBtn onDelete={()=>del(n.id)} label=""/>
            </div>
          </div>
        );
      })}
      {editNote&&<NoteModal item={editNote} contacts={contacts} notes={notes} onClose={()=>setEditNote(null)} onSave={v=>{onUpdate(v);setEditNote(null);showToast("Збережено ✓");}}/>}
    </div>
  );
}

function NoteModal({item,contacts,notes,onClose,onSave}){
  const isNew=!item||item._new;
  const [form,setForm]=useState({id:item?.id||uid(),type:item?.type||"note",title:item?.title||"",body:item?.body||"",remindDate:item?.remindDate||"",remindDone:item?.remindDone||false,contactIds:item?.contactIds||[],extraNames:item?.extraNames||[],pinned:item?.pinned||false,done:item?.done||false,createdAt:item?.createdAt||Date.now(),_new:isNew});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const toggleContact=(id)=>{const ids=form.contactIds||[];set("contactIds",ids.includes(id)?ids.filter(x=>x!==id):[...ids,id]);};
  const [showContacts,setShowContacts]=useState(false);
  const [contactSearch,setContactSearch]=useState("");
  const filteredContacts=contacts.filter(c=>c.name.toLowerCase().includes(contactSearch.toLowerCase()));
  const save=()=>{
    if(!form.title.trim()&&!form.body.trim()){alert("Додай текст або назву!");return;}
    const {_new,...clean}=form;
    const exists=notes.find(n=>n.id===form.id);
    onSave(exists?notes.map(n=>n.id===form.id?clean:n):[{...clean},...notes]);
  };
  const nt=getNoteType(form.type);
  const quickDate=(days)=>{const d=new Date();d.setDate(d.getDate()+days);set("remindDate",d.toISOString().slice(0,10));set("remindDone",false);};
  return(
    <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={modal}>
        <div style={modalTitle}><span style={{fontSize:15}}>{isNew?"Нова замітка":"Редагувати"}</span><button style={{background:"none",border:"none",color:"var(--muted)",fontSize:20,cursor:"pointer"}} onClick={onClose}>✕</button></div>
        <Row label="Тип"><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{NOTE_TYPES.map(t=>{const sel=form.type===t.id;return(<button key={t.id} onClick={()=>set("type",t.id)} style={{padding:"5px 12px",borderRadius:20,border:`1px solid ${sel?t.color:"var(--border2)"}`,background:sel?`${t.color}18`:"var(--surface2)",color:sel?t.color:"var(--muted)",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600,cursor:"pointer"}}>{t.emoji} {t.label}</button>);})}</div></Row>
        <Row label="Назва"><input style={inp} placeholder="Коротка назва..." value={form.title} onChange={e=>set("title",e.target.value)}/></Row>
        <Row label="Текст"><textarea style={{...inp,minHeight:88}} placeholder="Деталі, думки, інформація..." value={form.body} onChange={e=>set("body",e.target.value)}/></Row>
        <Row label="🔔 Нагадування">
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <input type="date" style={{...inp,flex:1}} value={form.remindDate} onChange={e=>{set("remindDate",e.target.value);set("remindDone",false);}}/>
            {form.remindDate&&<button onClick={()=>{set("remindDate","");set("remindDone",false);}} style={{...btnD,padding:"6px 10px",flexShrink:0}}>✕</button>}
          </div>
          <div style={{display:"flex",gap:5,marginTop:6,flexWrap:"wrap"}}>
            <button style={{...btnG,fontSize:11,padding:"3px 10px"}} onClick={()=>quickDate(0)}>Сьогодні</button>
            <button style={{...btnG,fontSize:11,padding:"3px 10px"}} onClick={()=>quickDate(1)}>Завтра</button>
            <button style={{...btnG,fontSize:11,padding:"3px 10px"}} onClick={()=>quickDate(7)}>За тиждень</button>
          </div>
        </Row>
        <Row label="👥 Контакти">
          <button onClick={()=>setShowContacts(s=>!s)} style={{...btnG,width:"100%",justifyContent:"space-between",display:"flex",alignItems:"center",marginBottom:6}}>
            <span>{(form.contactIds.length+(form.extraNames||[]).filter(Boolean).length)>0?`Вибрано: ${form.contactIds.length+(form.extraNames||[]).filter(Boolean).length}`:"Додати контакти"}</span>
            <span>{showContacts?"▲":"▼"}</span>
          </button>
          {form.contactIds.length>0&&<div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:6}}>{form.contactIds.map(id=>{const c=contacts.find(x=>x.id===id);if(!c)return null;return(<span key={id} style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:600,background:"var(--surface2)",border:"1px solid var(--border2)",color:"var(--text2)"}}>👤 {c.name}<button onClick={()=>toggleContact(id)} style={{background:"none",border:"none",color:"var(--danger)",cursor:"pointer",fontSize:11}}>✕</button></span>);})}</div>}
          {(form.extraNames||[]).filter(Boolean).length>0&&<div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:6}}>{(form.extraNames||[]).map((name,i)=>name?(<span key={i} style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:600,background:"rgba(74,158,244,.1)",border:"1px solid rgba(74,158,244,.3)",color:"#4a9ef4"}}>👤 {name}<button onClick={()=>{const a=[...(form.extraNames||[])];a.splice(i,1);set("extraNames",a);}} style={{background:"none",border:"none",color:"var(--danger)",cursor:"pointer",fontSize:11}}>✕</button></span>):null)}</div>}
          {showContacts&&(
            <div style={{background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:10,padding:8}}>
              <div style={{display:"flex",gap:6,marginBottom:8}}>
                <input style={{...inp,flex:1,fontSize:12}} placeholder="Ім'я вручну (не з контактів)..." id="extra-name-inp" onKeyDown={e=>{if(e.key==="Enter"&&e.target.value.trim()){set("extraNames",[...(form.extraNames||[]),e.target.value.trim()]);e.target.value=("");}}}/>
                <button style={{...btnT,padding:"5px 10px",flexShrink:0}} onClick={()=>{const el=document.getElementById("extra-name-inp");if(el&&el.value.trim()){set("extraNames",[...(form.extraNames||[]),el.value.trim()]);el.value="";}}}>+ Додати</button>
              </div>
              <input style={{...inp,marginBottom:6,fontSize:12}} placeholder="Пошук в контактах CRM..." value={contactSearch} onChange={e=>setContactSearch(e.target.value)}/>
              <div style={{maxHeight:150,overflowY:"auto"}}>
                {filteredContacts.map(c=>{const sel=(form.contactIds||[]).includes(c.id);return(<div key={c.id} onClick={()=>toggleContact(c.id)} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",borderRadius:6,cursor:"pointer",background:sel?"rgba(200,241,53,.08)":"transparent",marginBottom:2}}><div style={{width:16,height:16,borderRadius:4,border:`2px solid ${sel?"var(--accent)":"var(--border2)"}`,background:sel?"var(--accent)":"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"var(--bg)"}}>{sel&&"✓"}</div><span style={{fontSize:13,color:"var(--text)"}}>{c.name}</span></div>);})}
                {filteredContacts.length===0&&<div style={{color:"var(--muted)",fontSize:12,textAlign:"center",padding:8}}>Не знайдено</div>}
              </div>
            </div>
          )}
        </Row>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
          <button onClick={()=>set("pinned",!form.pinned)} style={{width:22,height:22,borderRadius:6,border:`2px solid ${form.pinned?"var(--accent)":"var(--border2)"}`,background:form.pinned?"rgba(200,241,53,.15)":"var(--surface2)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>{form.pinned&&<span style={{color:"var(--accent)"}}>✓</span>}</button>
          <span style={{fontSize:13,color:form.pinned?"var(--accent)":"var(--muted)",fontWeight:600}}>📌 Закріпити замітку</span>
        </div>
        <div style={{display:"flex",gap:8}}><button style={{...btnP,flex:1}} onClick={save}>Зберегти</button><button style={btnG} onClick={onClose}>Скасувати</button></div>
      </div>
    </div>
  );
}

function CalendarView({courts,trainings,onUpdateCourts,onUpdateTrainings,contacts,onOpenContact,settings,showToast}){
  const [weekOffset,setWeekOffset]=useState(0);
  const [courtModal,setCourtModal]=useState(null);
  const [trainModal,setTrainModal]=useState(null);
  const dates=getWeekDates(weekOffset);
  const CELL_H=60,TIME_W=48;
  // Dynamic column widths based on available screen width
  const screenW=typeof window!=="undefined"?window.innerWidth:1400;
  const availW=screenW-TIME_W;
  const dayW=Math.max(170,Math.floor(availW/7));
  const COURT_W=Math.floor(dayW*0.38);
  const TRAIN_W=dayW-COURT_W;
  const fmt=(d)=>{const dt=new Date(d+"T00:00:00");return DAY_NAMES_SHORT[(dt.getDay()+6)%7]+" "+dt.getDate()+" "+MONTH_NAMES[dt.getMonth()];};
  const rangeLabel=fmt(dates[0])+" – "+fmt(dates[6]);

/* ── iOS-friendly name autocomplete ── */
function NameInput({value,onChange,names,placeholder,style:extraStyle}){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState(value||"");
  const ref=React.useRef(null);

  // Sync external value
  React.useEffect(()=>{setQ(value||"");},[value]);

  // Close on outside click
  React.useEffect(()=>{
    const h=(e)=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",h);document.addEventListener("touchstart",h);
    return()=>{document.removeEventListener("mousedown",h);document.removeEventListener("touchstart",h);};
  },[]);

  const filtered=q.length>0?names.filter(n=>n.toLowerCase().includes(q.toLowerCase())).slice(0,8):names.slice(0,8);

  const select=(name)=>{setQ(name);onChange(name);setOpen(false);};

  return(
    <div ref={ref} style={{position:"relative",flex:1}}>
      <input
        style={{...inp,...(extraStyle||{})}}
        placeholder={placeholder||"Ім'я..."}
        value={q}
        onChange={e=>{setQ(e.target.value);onChange(e.target.value);setOpen(true);}}
        onFocus={()=>setOpen(true)}
      />
      {open&&filtered.length>0&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:500,
          background:"var(--surface)",border:"1px solid var(--border2)",borderRadius:8,
          boxShadow:"0 4px 20px rgba(0,0,0,.4)",maxHeight:200,overflowY:"auto",marginTop:2}}>
          {filtered.map(n=>(
            <div key={n}
              onMouseDown={e=>{e.preventDefault();select(n);}}
              onTouchEnd={e=>{e.preventDefault();select(n);}}
              style={{padding:"10px 12px",fontSize:13,cursor:"pointer",
                borderBottom:"1px solid var(--border)",color:"var(--text)",
                background:"transparent"}}
              onMouseEnter={e=>e.currentTarget.style.background="var(--surface2)"}
              onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              {n}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TrainingModal({item,contacts,trainings,settings,onClose,onSave,onDelete}){
  const isGroup=(t)=>{
    if(!t)return false;
    // Check by known ids (backwards compat)
    if(t==="padel_grp"||t==="padel_aly"||t==="group_train")return true;
    // Check by label in settings
    const trainTypes=settings?.trainTypes||TRAIN_TYPES;
    const found=trainTypes.find(x=>x.id===t);
    if(found&&found.label){
      const lbl=found.label.toLowerCase();
      return lbl.includes("груп")||lbl.includes("group")||lbl.includes("групов");
    }
    return false;
  };
  const initPlayers=item.players&&item.players.length?[...item.players]:["","","",""];
  const [form,setForm]=useState({id:item.id||uid(),date:item.date||TODAY,hour:item.hour||9,type:item.type||"",duration:item.duration||1,player:item.player||"",paid:item.paid||false,players:initPlayers,paidPlayers:item.paidPlayers||Array(initPlayers.length).fill(false),note:item.note||"",isNew:item.isNew!==false});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const setPlayer=(i,v)=>{const a=[...form.players];a[i]=v;set("players",a);};
  const togglePaidP=(i)=>{const a=[...form.paidPlayers];a[i]=!a[i];set("paidPlayers",a);};
  const addSlot=()=>{set("players",[...form.players,""]);set("paidPlayers",[...form.paidPlayers,false]);};
  const save=()=>{if(!form.type){alert("Оберіть тип!");return;}onSave(form);};
  const contactNames=contacts.map(c=>c.name);
  const calNames=getCalendarNames(trainings);
  const allNames=[...new Set([...contactNames,...calNames])].sort();
  const group=isGroup(form.type);
  return(
    <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={modal}>
        <div style={modalTitle}><span style={{fontSize:14}}>{form.isNew?"Нове тренування":"Редагувати"} · {form.date} · {String(form.hour).padStart(2,"0")}:00</span><button style={{background:"none",border:"none",color:"var(--muted)",fontSize:20,cursor:"pointer"}} onClick={onClose}>✕</button></div>
        <Row label="Тривалість"><select style={inp} value={form.duration} onChange={e=>set("duration",parseInt(e.target.value))}>{[1,2,3,4].map(d=><option key={d} value={d}>{d} год</option>)}</select></Row>
        <Row label="Тип тренування *"><div style={{display:"flex",flexDirection:"column",gap:4}}>{(settings?.trainTypes||TRAIN_TYPES).map(t=>{const sel=form.type===t.id;const tBg=t.bg||t.color+"2e";return(<button key={t.id} onClick={()=>set("type",t.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 10px",borderRadius:8,border:`1px solid ${sel?t.color:"var(--border2)"}`,background:sel?(t.bg||t.color+"2e"):"var(--surface2)",cursor:"pointer",textAlign:"left",fontFamily:"'DM Sans',sans-serif",transition:"all .15s"}}><span style={{width:9,height:9,borderRadius:"50%",background:t.color,flexShrink:0}}/><span style={{fontSize:13,fontWeight:sel?600:400,color:sel?t.color:"var(--muted)"}}>{t.label}</span></button>);})}</div></Row>
        {!group&&(<><Row label="Ім'я гравця"><div style={{display:"flex"}}><NameInput value={form.player} onChange={v=>set("player",v)} names={allNames} placeholder="Ім'я та прізвище"/></div></Row><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:11}}><button onClick={()=>set("paid",!form.paid)} style={{width:22,height:22,borderRadius:6,border:`2px solid ${form.paid?"var(--accent2)":"var(--border2)"}`,background:form.paid?"rgba(74,240,176,.15)":"var(--surface2)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{form.paid&&<span style={{color:"var(--accent2)",fontSize:13}}>✓</span>}</button><span style={{fontSize:13,color:form.paid?"var(--accent2)":"var(--muted)",fontWeight:600}}>Оплачено</span></div></>)}
        {group&&(<Row label="Учасники">{form.players.map((p,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}><span style={{fontSize:11,color:"var(--muted)",width:18,textAlign:"right",flexShrink:0}}>{i+1}.</span><NameInput value={p} onChange={v=>setPlayer(i,v)} names={allNames} placeholder={`Гравець ${i+1}`}/>{p&&(<button onClick={()=>togglePaidP(i)} style={{padding:"4px 8px",borderRadius:6,border:"none",flexShrink:0,background:(form.paidPlayers||[])[i]?"rgba(74,240,176,.15)":"rgba(255,79,106,.12)",color:(form.paidPlayers||[])[i]?"var(--accent2)":"var(--danger)",fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:700,cursor:"pointer"}}>{(form.paidPlayers||[])[i]?"✅ Опл":"❌ Не опл"}</button>)}</div>))}<button onClick={addSlot} style={{...btnG,fontSize:11,padding:"5px 12px",marginTop:2}}>+ Додати гравця</button></Row>)}

      </div>

  const remM=(gid,name)=>onUpdate(groups.map(g=>g.id===gid?{...g,members:g.members.filter(m=>m!==name)}:g));
  const delG=(id)=>{if(!confirm("Видалити групу?"))return;onUpdate(groups.filter(g=>g.id!==id));showToast("Видалено");};

  return(
    <div>
      <div style={secTitle}>ГРУПИ</div>

            </div>

            {g.note&&<div style={{fontSize:13,color:"#9097b5",marginBottom:8}}>{g.note}</div>}

              {members.map(m=>(

                  {m}<button onClick={()=>remM(g.id,m)} style={{background:"none",border:"none",color:"#ff4f6a",cursor:"pointer",fontSize:11}}>✕</button>

          </div>

      })}

}

/* ══════════════════════════════════════════════════════
   ANALYTICS
══════════════════════════════════════════════════════ */
function Analytics({trainings,contacts,settings}){
  const [view,setView]=useState("trainings");
  const [weekOffset,setWeekOffset]=useState(0);
  const [monthOffset,setMonthOffset]=useState(0);

  function getWeekRange(off){
    const now=new Date();const day=now.getDay();const mon=new Date(now);
    mon.setDate(now.getDate()-((day+6)%7)+off*7);
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    return{start:toLocalISO(mon),end:toLocalISO(sun),
      label:mon.getDate()+" "+MONTH_NAMES[mon.getMonth()]+" - "+sun.getDate()+" "+MONTH_NAMES[sun.getMonth()]};
  }
  function getMonthRange(off){
    const now=new Date();const d=new Date(now.getFullYear(),now.getMonth()+off,1);
    const end=new Date(d.getFullYear(),d.getMonth()+1,0);
    return{start:toLocalISO(d),end:toLocalISO(end),label:MONTH_NAMES[d.getMonth()]+" "+d.getFullYear()};
  }

  const week=getWeekRange(weekOffset);
  const month=getMonthRange(monthOffset);
  const weekT=trainings.filter(t=>t.date>=week.start&&t.date<=week.end);
  const monthT=trainings.filter(t=>t.date>=month.start&&t.date<=month.end);
  const trainTypes=settings?.trainTypes||TRAIN_TYPES;

  function byType(arr){
    return trainTypes.map(tt=>({...tt,count:arr.filter(t=>t.type===tt.id).length})).filter(x=>x.count>0);
  }
  const wByType=byType(weekT);
  const mByType=byType(monthT);

  function getClientStats(){
    const m={};
    trainings.forEach(t=>{
      const names=[];
      if(t.player)names.push(t.player);
      (t.players||[]).filter(Boolean).forEach(p=>names.push(p));
      names.forEach(name=>{
        if(!m[name])m[name]={name,count:0,lastDate:null};
        m[name].count++;
        if(!m[name].lastDate||t.date>m[name].lastDate)m[name].lastDate=t.date;
      });
    });
    return Object.values(m).sort((a,b)=>(b.lastDate||"").localeCompare(a.lastDate||""));
  }
  function status(lastDate){
    if(!lastDate)return{label:"Невідомо",color:"var(--muted)"};
    const days=Math.floor((new Date()-new Date(lastDate+"T00:00:00"))/86400000);
    if(days<=14)return{label:"Активний",color:"var(--accent2)"};
    if(days<=30)return{label:"Пауза",color:"var(--warn)"};
    return{label:"Відтік",color:"var(--danger)"};
  }
  function daysAgo(date){
    if(!date)return"—";
    const days=Math.floor((new Date()-new Date(date+"T00:00:00"))/86400000);
    if(days===0)return"сьогодні";if(days===1)return"вчора";
    if(days<7)return days+" дн тому";if(days<30)return Math.floor(days/7)+" тиж тому";
    return Math.floor(days/30)+" міс тому";
  }

  const clients=getClientStats();
  const [cf,setCf]=useState("all");
  const activeC=clients.filter(c=>status(c.lastDate).label==="Активний").length;
  const pauseC=clients.filter(c=>status(c.lastDate).label==="Пауза").length;
  const churnC=clients.filter(c=>status(c.lastDate).label==="Відтік").length;
  const filteredC=cf==="all"?clients:clients.filter(c=>status(c.lastDate).label===cf);

  const TypeBar=({item,max,total})=>(
    <div style={{marginBottom:9}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
        <span style={{fontSize:12,color:"var(--text)"}}>{item.label}</span>
        <span style={{fontSize:12,color:item.color,fontWeight:700}}>{item.count} <span style={{color:"var(--muted)",fontWeight:400,fontSize:11}}>({total>0?Math.round(item.count/total*100):0}%)</span></span>
      </div>
      <div style={{height:7,borderRadius:4,background:"var(--surface2)",overflow:"hidden"}}>
        <div style={{height:"100%",borderRadius:4,background:item.color,width:(item.count/max*100)+"%",transition:"width .4s"}}/>
      </div>
    </div>
  );

  const NavBar=({label,onPrev,onNext,canNext,onReset,isCurrent})=>(
    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
      <button style={iconBtn} onClick={onPrev}>‹</button>
      <span style={{fontSize:12,color:"var(--muted)",minWidth:150,textAlign:"center"}}>{label}</span>
      <button style={{...iconBtn,opacity:canNext?.4:1}} onClick={canNext?null:onNext} disabled={canNext}>›</button>
      {!isCurrent&&<button style={{...btnG,fontSize:11,padding:"3px 8px"}} onClick={onReset}>Зараз</button>}
    </div>
  );

  return(
    <div>
      <div style={secTitle}>АНАЛІТИКА</div>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        <button style={view==="trainings"?fOn:fOff} onClick={()=>setView("trainings")}>Тренування</button>
        <button style={view==="clients"?fOn:fOff} onClick={()=>setView("clients")}>Клієнти</button>
      </div>

      {view==="trainings"&&(<>
        {/* Week */}
        <div style={card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
            <span style={{fontWeight:600}}>За тиждень</span>
            <NavBar label={weekOffset===0?"Цей тиждень":week.label} onPrev={()=>setWeekOffset(w=>w-1)} onNext={()=>setWeekOffset(w=>w+1)} canNext={weekOffset>=0} onReset={()=>setWeekOffset(0)} isCurrent={weekOffset===0}/>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{textAlign:"center",flexShrink:0}}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:42,fontWeight:700,color:"var(--accent)",lineHeight:1}}>{weekT.length}</div>
              <div style={{fontSize:11,color:"var(--muted)"}}>тренувань</div>
            </div>
            <div style={{flex:1}}>
              {wByType.length===0&&<div style={{color:"var(--muted)",fontSize:12}}>Тренувань немає</div>}
              {wByType.map(t=><TypeBar key={t.id} item={t} max={Math.max(...wByType.map(x=>x.count),1)} total={weekT.length}/>)}
            </div>
          </div>
        </div>

        {/* Month */}
        <div style={card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
            <span style={{fontWeight:600}}>За місяць</span>
            <NavBar label={month.label} onPrev={()=>setMonthOffset(m=>m-1)} onNext={()=>setMonthOffset(m=>m+1)} canNext={monthOffset>=0} onReset={()=>setMonthOffset(0)} isCurrent={monthOffset===0}/>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{textAlign:"center",flexShrink:0}}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:42,fontWeight:700,color:"#b07fff",lineHeight:1}}>{monthT.length}</div>
              <div style={{fontSize:11,color:"var(--muted)"}}>тренувань</div>
            </div>
            <div style={{flex:1}}>
              {mByType.length===0&&<div style={{color:"var(--muted)",fontSize:12}}>Тренувань немає</div>}
              {mByType.map(t=><TypeBar key={t.id} item={t} max={Math.max(...mByType.map(x=>x.count),1)} total={monthT.length}/>)}
            </div>
          </div>
        </div>
      </>)}

      {view==="clients"&&(<>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
          {[{n:activeC,l:"Активні",c:"var(--accent2)"},{n:pauseC,l:"Пауза",c:"var(--warn)"},{n:churnC,l:"Відтік",c:"var(--danger)"}].map((s,i)=>(
            <div key={i} style={{...card,marginBottom:0,textAlign:"center",padding:10}}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:700,color:s.c,lineHeight:1}}>{s.n}</div>
              <div style={{fontSize:11,color:"var(--muted)",marginTop:2}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
          <button style={cf==="all"?fOn:fOff} onClick={()=>setCf("all")}>Всі ({clients.length})</button>
          <button style={cf==="Активний"?fOn:fOff} onClick={()=>setCf("Активний")}>🟢 Активні</button>
          <button style={cf==="Пауза"?{...fOn,borderColor:"var(--warn)",color:"var(--warn)"}:fOff} onClick={()=>setCf("Пауза")}>🟡 Пауза</button>
          <button style={cf==="Відтік"?{...fOn,borderColor:"var(--danger)",color:"var(--danger)"}:fOff} onClick={()=>setCf("Відтік")}>🔴 Відтік</button>
        </div>
        {filteredC.length===0&&<Empty icon="📊" text="Немає даних" sub="Додай тренування в календар"/>}
        {filteredC.map(c=>{
          const st=status(c.lastDate);
          const contact=contacts.find(x=>x.name===c.name);
          return(
            <div key={c.name} style={{...card,display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:st.color,flexShrink:0}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:14}}>{c.name}
                  {contact&&<span style={{fontSize:10,color:"var(--accent2)",marginLeft:6,padding:"1px 6px",borderRadius:10,background:"rgba(74,240,176,.1)"}}>в CRM</span>}
                </div>
                <div style={{display:"flex",gap:10,marginTop:3,flexWrap:"wrap"}}>
                  <span style={{fontSize:12,color:"var(--muted)"}}>Тренувань: <span style={{color:"var(--text)",fontWeight:600}}>{c.count}</span></span>
                  <span style={{fontSize:12,color:"var(--muted)"}}>Останнє: <span style={{color:st.color,fontWeight:600}}>{daysAgo(c.lastDate)}</span></span>
                </div>
              </div>
              <span style={{fontSize:11,fontWeight:700,color:st.color,padding:"2px 8px",borderRadius:12,background:`${st.color}18`,flexShrink:0}}>{st.label}</span>
            </div>
          );
        })}
      </>)}
    </div>
  );
}

/* ══════════════════════════════════════════════════════
