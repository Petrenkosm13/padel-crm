function SettingsModal({settings,onClose,onSave}){
  const DEFAULT_DASH=[
    {id:"today_trainings",label:"Тренування сьогодні",enabled:true,order:0},
    {id:"reminders",label:"Нагадування",enabled:true,order:1},
    {id:"quick_note",label:"Швидка замітка",enabled:true,order:2},
    {id:"week_stats",label:"Статистика тижня",enabled:false,order:3},
    {id:"client_activity",label:"Активність клієнтів",enabled:false,order:4},
    {id:"groups_block",label:"Групи",enabled:false,order:5},
  ];
  const merged={...settings,dashBlocks:settings.dashBlocks&&settings.dashBlocks.length>0?settings.dashBlocks:DEFAULT_DASH};
  const [form,setForm]=useState(JSON.parse(JSON.stringify(merged)));
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
  const addTrainType=()=>setF("trainTypes",[...form.trainTypes,{id:uid(),label:"Новий тип",color:"#9097b5"}]);
  const delTrainType=(id)=>setF("trainTypes",form.trainTypes.filter(t=>t.id!==id));
  const updTrainType=(id,k,v)=>setF("trainTypes",form.trainTypes.map(t=>t.id===id?{...t,[k]:v}:t));
  const addCourtType=()=>setF("courtTypes",[...form.courtTypes,{id:uid(),label:"Новий корт",color:"#9097b5"}]);
  const delCourtType=(id)=>setF("courtTypes",form.courtTypes.filter(c=>c.id!==id));
  const updCourtType=(id,k,v)=>setF("courtTypes",form.courtTypes.map(c=>c.id===id?{...c,[k]:v}:c));
  const addStatus=()=>setF("statuses",[...form.statuses,{id:uid(),label:"Новий статус",color:"#9097b5"}]);
  const delStatus=(id)=>setF("statuses",form.statuses.filter(s=>s.id!==id));
  const updStatus=(id,k,v)=>setF("statuses",form.statuses.map(s=>s.id===id?{...s,[k]:v}:s));
  const [newLevel,setNewLevel]=useState("");
  const addLevel=()=>{if(!newLevel.trim())return;setF("levels",[...form.levels,newLevel.trim()]);setNewLevel("");};
  const delLevel=(l)=>setF("levels",form.levels.filter(x=>x!==l));
  const updLevel=(i,v)=>{const a=[...form.levels];a[i]=v;setF("levels",a);};
  const addChannel=()=>setF("channels",[...form.channels,{id:uid(),label:"Новий канал",color:"#9097b5"}]);
  const delChannel=(id)=>setF("channels",form.channels.filter(c=>c.id!==id));
  const updChannel=(id,k,v)=>setF("channels",form.channels.map(c=>c.id===id?{...c,[k]:v}:c));

  const ST=({children})=>(<div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:700,letterSpacing:1.5,color:"var(--accent)",margin:"18px 0 10px",borderBottom:"1px solid var(--border)",paddingBottom:6}}>{children}</div>);
  // CR is inlined to avoid re-mount focus loss - use renderItem helper instead
  const renderItem=(item,onLabel,onColor,onDel,onUp,onDown,showOrder)=>(
    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
      <input type="color" value={item.color} onChange={e=>onColor(e.target.value)} style={{width:32,height:32,borderRadius:6,border:"1px solid var(--border2)",cursor:"pointer",padding:2,background:"var(--surface2)",flexShrink:0}}/>
      <div style={{width:8,height:8,borderRadius:"50%",background:item.color,flexShrink:0}}/>
      <input style={{...inp,flex:1}} value={item.label} onChange={e=>onLabel(e.target.value)}/>
      {showOrder&&<div style={{display:"flex",flexDirection:"column",gap:2}}>
        {onUp&&<button style={{...iconBtn,padding:"1px 6px",fontSize:10,lineHeight:1}} onClick={onUp}>&#9650;</button>}
        {onDown&&<button style={{...iconBtn,padding:"1px 6px",fontSize:10,lineHeight:1}} onClick={onDown}>&#9660;</button>}
      </div>}
      <DeleteBtn onDelete={onDel} label="" style={{padding:"5px 8px",flexShrink:0}}/>
    </div>
  );

  return(
    <div style={{...overlay,alignItems:"flex-start",overflowY:"auto"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{...modal,borderRadius:16,margin:"20px auto",maxHeight:"calc(100vh - 40px)"}}>
        <div style={modalTitle}><span>Налаштування</span><button style={{background:"none",border:"none",color:"var(--muted)",fontSize:20,cursor:"pointer"}} onClick={onClose}>x</button></div>
        <ST>Типи тренувань</ST>
        {form.trainTypes.map((t,i)=>
          <div key={t.id}>{renderItem(t,v=>updTrainType(t.id,"label",v),v=>updTrainType(t.id,"color",v),()=>delTrainType(t.id),
            i>0?()=>{const a=[...form.trainTypes];[a[i-1],a[i]]=[a[i],a[i-1]];setF("trainTypes",a);}:null,
            i<form.trainTypes.length-1?()=>{const a=[...form.trainTypes];[a[i],a[i+1]]=[a[i+1],a[i]];setF("trainTypes",a);}:null,
            true)}</div>)}
        <button style={{...btnG,fontSize:12,marginBottom:4}} onClick={addTrainType}>+ Додати тип</button>
        <ST>Типи кортів</ST>
        {form.courtTypes.map((c,i)=>
          <div key={c.id}>{renderItem(c,v=>updCourtType(c.id,"label",v),v=>updCourtType(c.id,"color",v),()=>delCourtType(c.id),
            i>0?()=>{const a=[...form.courtTypes];[a[i-1],a[i]]=[a[i],a[i-1]];setF("courtTypes",a);}:null,
            i<form.courtTypes.length-1?()=>{const a=[...form.courtTypes];[a[i],a[i+1]]=[a[i+1],a[i]];setF("courtTypes",a);}:null,
            true)}</div>)}
        <button style={{...btnG,fontSize:12,marginBottom:4}} onClick={addCourtType}>+ Додати тип</button>
        <ST>Статуси контактів</ST>
        {form.statuses.map((s,i)=>
          <div key={s.id}>{renderItem(s,v=>updStatus(s.id,"label",v),v=>updStatus(s.id,"color",v),()=>delStatus(s.id),
            i>0?()=>{const a=[...form.statuses];[a[i-1],a[i]]=[a[i],a[i-1]];setF("statuses",a);}:null,
            i<form.statuses.length-1?()=>{const a=[...form.statuses];[a[i],a[i+1]]=[a[i+1],a[i]];setF("statuses",a);}:null,
            true)}</div>)}
        <button style={{...btnG,fontSize:12,marginBottom:4}} onClick={addStatus}>+ Додати статус</button>
        <ST>Рівні гравців</ST>
        {form.levels.map((l,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}><input style={{...inp,flex:1}} value={l} onChange={e=>updLevel(i,e.target.value)}/><DeleteBtn onDelete={()=>delLevel(l)} label="" style={{padding:"5px 8px",flexShrink:0}}/></div>))}
        <div style={{display:"flex",gap:6,marginBottom:4}}><input style={{...inp,flex:1}} placeholder="Новий рівень..." value={newLevel} onChange={e=>setNewLevel(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addLevel()}/><button style={{...btnG,fontSize:12,flexShrink:0}} onClick={addLevel}>+ Додати</button></div>
        <ST>Канали спілкування</ST>
        {form.channels.map((c,i)=>
          <div key={c.id}>{renderItem(c,v=>updChannel(c.id,"label",v),v=>updChannel(c.id,"color",v),()=>delChannel(c.id),
            i>0?()=>{const a=[...form.channels];[a[i-1],a[i]]=[a[i],a[i-1]];setF("channels",a);}:null,
            i<form.channels.length-1?()=>{const a=[...form.channels];[a[i],a[i+1]]=[a[i+1],a[i]];setF("channels",a);}:null,
            true)}</div>)}
        <button style={{...btnG,fontSize:12,marginBottom:4}} onClick={addChannel}>+ Додати канал</button>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:700,letterSpacing:1.5,color:"var(--accent)",margin:"18px 0 10px",borderBottom:"1px solid var(--border)",paddingBottom:6}}>Блоки екрану "Сьогодні"</div>
        {(form.dashBlocks||[]).sort((a,b)=>a.order-b.order).map((block,i,arr)=>(
          <div key={block.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,padding:"6px 8px",background:"var(--surface2)",borderRadius:8,border:"1px solid var(--border2)"}}>
            <button onClick={()=>{const a=[...(form.dashBlocks||[])];const idx=a.findIndex(b=>b.id===block.id);a[idx]={...a[idx],enabled:!a[idx].enabled};setF("dashBlocks",a);}}
              style={{width:22,height:22,borderRadius:6,border:`2px solid ${block.enabled?"var(--accent2)":"var(--border2)"}`,background:block.enabled?"rgba(74,240,176,.15)":"var(--surface2)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              {block.enabled&&<span style={{color:"var(--accent2)",fontSize:11}}>&#10003;</span>}
            </button>
            <span style={{flex:1,fontSize:13,color:block.enabled?"var(--text)":"var(--muted)"}}>{block.label}</span>
            <div style={{display:"flex",gap:4}}>
              {i>0&&<button style={{...iconBtn,fontSize:11,padding:"2px 6px"}} onClick={()=>{const a=[...(form.dashBlocks||[])].sort((x,y)=>x.order-y.order);const idx=a.findIndex(b=>b.id===block.id);if(idx>0){const tmp=a[idx].order;a[idx]={...a[idx],order:a[idx-1].order};a[idx-1]={...a[idx-1],order:tmp};setF("dashBlocks",a);}}}>&#8593;</button>}
              {i<arr.length-1&&<button style={{...iconBtn,fontSize:11,padding:"2px 6px"}} onClick={()=>{const a=[...(form.dashBlocks||[])].sort((x,y)=>x.order-y.order);const idx=a.findIndex(b=>b.id===block.id);if(idx<a.length-1){const tmp=a[idx].order;a[idx]={...a[idx],order:a[idx+1].order};a[idx+1]={...a[idx+1],order:tmp};setF("dashBlocks",a);}}}>&#8595;</button>}
            </div>
          </div>
        ))}
        <div style={{height:1,background:"var(--border)",margin:"16px 0"}}/>
        <div style={{display:"flex",gap:8}}><button style={{...btnP,flex:1}} onClick={()=>onSave(form)}>Зберегти</button><button style={btnG} onClick={onClose}>Скасувати</button></div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
