<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PadelCRM">
<meta name="theme-color" content="#090c14">
<title>Padel CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="module">
  import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import{getFirestore,doc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const app=initializeApp({
    apiKey:"AIzaSyApGAnm3kdlmdNX0H3DnJQIpGXFrS6-2zA",
    authDomain:"padel-crm-6fdaa.firebaseapp.com",
    projectId:"padel-crm-6fdaa",
    storageBucket:"padel-crm-6fdaa.firebasestorage.app",
    messagingSenderId:"844325609833",
    appId:"1:844325609833:web:12b6b01d740297bf131df8"
  });
  const auth=getAuth(app);
  const db=getFirestore(app);
  let _unsub=null;
  getRedirectResult(auth).catch(()=>{});
  window._fb={
    signIn:()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>signInWithRedirect(auth,new GoogleAuthProvider())),
    signOut:()=>signOut(auth),
    onAuth:(cb)=>onAuthStateChanged(auth,cb),
    save:async(uid,data)=>{await setDoc(doc(db,"users",uid),data,{merge:true});},
    listen:(uid,cb)=>{
      if(_unsub)_unsub();
      _unsub=onSnapshot(doc(db,"users",uid),snap=>{if(snap.exists())cb(snap.data());});
      return()=>{if(_unsub)_unsub();};
    }
  };
  window._fbReady=true;
  window.dispatchEvent(new Event("fbReady"));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}html,body,#root{height:100%;}
body{--bg:#090c14;--surface:#0f1220;--surface2:#1a2035;--border:#1e253a;--border2:#2a3248;--text:#e4e8f4;--text2:#9097b5;--muted:#6b7394;--accent:#c8f135;--accent2:#4af0b0;--danger:#ff4f6a;--warn:#ffb830;--cal-line:#131929;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-tap-highlight-color:transparent;transition:background .25s,color .25s;}
body.light{--bg:#f2f4f8;--surface:#fff;--surface2:#eef0f6;--border:#dde0ea;--border2:#c8ccda;--text:#1a1d2e;--text2:#4a5072;--muted:#8890aa;--accent:#5a9e00;--accent2:#008f62;--danger:#d93050;--warn:#c07000;--cal-line:#e8eaf0;}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:var(--surface);}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
input,textarea,select{transition:border-color .2s;}input:focus,textarea:focus,select:focus{border-color:var(--accent)!important;outline:none;}textarea{resize:vertical;}select option{background:var(--surface2);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

const CHANNELS=[{id:"facebook",label:"Facebook",emoji:"📘",color:"#1877F2"},{id:"threads",label:"Threads",emoji:"🧵",color:"#aaa"},{id:"instagram",label:"Instagram",emoji:"📸",color:"#E1306C"},{id:"whatsapp",label:"WhatsApp",emoji:"💬",color:"#25D366"},{id:"telegram",label:"Telegram",emoji:"✈️",color:"#229ED9"},{id:"personal",label:"Особисто",emoji:"🤝",color:"#c8f135"}];
const STATUSES=[{id:"lead",label:"Потенційний",color:"#6b7394",bg:"rgba(107,115,148,.15)"},{id:"new",label:"Новий",color:"#c8f135",bg:"rgba(200,241,53,.12)"},{id:"once",label:"Був 1 раз",color:"#ffb830",bg:"rgba(255,184,48,.12)"},{id:"regular",label:"Регулярний",color:"#4af0b0",bg:"rgba(74,240,176,.12)"},{id:"group",label:"Хоче в групу",color:"#b07fff",bg:"rgba(176,127,255,.12)"},{id:"inactive",label:"Неактивний",color:"#ff4f6a",bg:"rgba(255,79,106,.12)"}];
const LEVELS=["Початківець","Нижче середнього","Середній","Вище середнього","Просунутий"];
const TABS=[{id:"dashboard",label:"Дашборд",icon:"⚡"},{id:"calendar",label:"Календар",icon:"📅"},{id:"contacts",label:"Контакти",icon:"👥"},{id:"reminders",label:"Нагадув.",icon:"🔔"},{id:"notes",label:"Замітки",icon:"📝"},{id:"groups",label:"Групи",icon:"🎾"},{id:"posts",label:"Пости",icon:"📣"}];
const NOTE_TYPES=[{id:"note",label:"Замітка",emoji:"📝",color:"#9097b5"},{id:"todo",label:"Написати комусь",emoji:"✉️",color:"#4a9ef4"},{id:"event",label:"Подія",emoji:"📅",color:"#b07fff"},{id:"task",label:"Завдання",emoji:"✅",color:"#4af0b0"}];
const WEEK_DAYS=[{id:1,short:"Пн",long:"Понеділок"},{id:2,short:"Вт",long:"Вівторок"},{id:3,short:"Ср",long:"Середа"},{id:4,short:"Чт",long:"Четвер"},{id:5,short:"Пт",long:"П'ятниця"},{id:6,short:"Сб",long:"Субота"},{id:0,short:"Нд",long:"Неділя"}];
const TRAIN_TYPES=[{id:"padel_ind",label:"Падл індивідуальний",color:"#9b8ef4",bg:"rgba(155,142,244,.18)"},{id:"padel_grp",label:"Падл груповий",color:"#f4a23a",bg:"rgba(244,162,58,.18)"},{id:"squash_ind",label:"Сквош індивідуальний",color:"#4a9ef4",bg:"rgba(74,158,244,.18)"},{id:"my_train",label:"Моє тренування",color:"#f46a6a",bg:"rgba(244,106,106,.18)"},{id:"padel_aly",label:"Падл груповий (Alyona)",color:"#f4c53a",bg:"rgba(244,197,58,.18)"}];
const COURTS=[{id:"padel",label:"Падл",color:"#4af0b0"},{id:"squash",label:"Сквош",color:"#4a9ef4"}];
const HOURS=Array.from({length:17},(_,i)=>i+7);
const TODAY=(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;})();
const DAY_NAMES_SHORT=["Нд","Пн","Вт","Ср","Чт","Пт","Сб"];
const MONTH_NAMES=["Січ","Лют","Бер","Квіт","Трав","Черв","Лип","Серп","Вер","Жовт","Лист","Груд"];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function getStatus(id){return STATUSES.find(s=>s.id===id)||STATUSES[0];}
function getChannel(id){return CHANNELS.find(c=>c.id===id);}
function getTrainType(id){return TRAIN_TYPES.find(t=>t.id===id)||TRAIN_TYPES[0];}
function getCourt(id){return COURTS.find(c=>c.id===id);}
function getNoteType(id){return NOTE_TYPES.find(t=>t.id===id)||NOTE_TYPES[0];}
function getMembers(g){return(g.members||[]).map(m=>typeof m==="string"?{name:m,paid:{}}:m);}
function formatDate(d){if(!d)return"";const dt=new Date(d+"T00:00:00");return dt.toLocaleDateString("uk-UA",{day:"numeric",month:"short"});}
function getCalendarNames(trainings){const names=new Set();(trainings||[]).forEach(t=>{if(t.player&&t.player.trim())names.add(t.player.trim());(t.players||[]).forEach(p=>{if(p&&p.trim())names.add(p.trim());});});return Array.from(names).sort();}
function toLocalISO(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,"0");const day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`;}
function getWeekDates(offset=0){const now=new Date();const day=now.getDay();const mon=new Date(now);mon.setDate(now.getDate()-((day+6)%7)+offset*7);return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return toLocalISO(d);});}

const card={background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:14,marginBottom:10};
const inp={width:"100%",background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:8,color:"var(--text)",fontFamily:"'DM Sans',sans-serif",fontSize:13,padding:"8px 10px"};
const overlay={position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"};
const modal={background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"16px 16px 0 0",padding:20,width:"100%",maxWidth:580,maxHeight:"90vh",overflowY:"auto"};
const modalTitle={fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:700,letterSpacing:1.5,color:"var(--accent)",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"};
const secTitle={fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:700,letterSpacing:2,color:"var(--accent)",marginBottom:12};
const btnP={padding:"7px 14px",borderRadius:8,border:"none",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600,cursor:"pointer",background:"var(--accent)",color:"var(--bg)"};
const btnG={padding:"7px 14px",borderRadius:8,border:"1px solid var(--border2)",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600,cursor:"pointer",background:"var(--surface2)",color:"var(--text)"};
const btnT={padding:"5px 10px",borderRadius:8,border:"none",fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:600,cursor:"pointer",background:"rgba(74,240,176,.12)",color:"var(--accent2)"};
const btnD={padding:"5px 10px",borderRadius:8,border:"none",fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:600,cursor:"pointer",background:"rgba(255,79,106,.12)",color:"var(--danger)"};
const iconBtn={padding:"5px 8px",borderRadius:8,background:"var(--surface2)",border:"1px solid var(--border2)",color:"var(--muted)",cursor:"pointer",fontSize:13};
const fOn={padding:"5px 11px",borderRadius:20,border:"1px solid var(--accent)",background:"rgba(200,241,53,.08)",color:"var(--accent)",fontSize:12,fontWeight:600,cursor:"pointer"};
const fOff={padding:"5px 11px",borderRadius:20,border:"1px solid var(--border2)",background:"var(--surface2)",color:"var(--muted)",fontSize:12,fontWeight:600,cursor:"pointer"};

function StatusPill({status}){const s=getStatus(status);return <span style={{padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700,background:s.bg,color:s.color}}>{s.label}</span>;}
function ChannelChip({channel}){const c=getChannel(channel);if(!c)return null;return <span style={{display:"inline-flex",alignItems:"center",gap:3,padding:"2px 7px",borderRadius:6,fontSize:11,fontWeight:600,background:"var(--surface2)",border:"1px solid var(--border2)",color:c.color}}>{c.emoji} {c.label}</span>;}
function ProgBar({pct,color="var(--accent)",h=6}){return <div style={{height:h,borderRadius:h/2,background:"var(--surface2)",overflow:"hidden"}}><div style={{height:"100%",borderRadius:h/2,background:color,width:Math.min(pct||0,100)+"%",transition:"width .3s"}}/></div>;}
function Empty({icon,text,sub}){return <div style={{textAlign:"center",color:"var(--muted)",padding:"48px 0"}}><div style={{fontSize:36,marginBottom:8}}>{icon}</div><div>{text}</div>{sub&&<div style={{fontSize:12,marginTop:4}}>{sub}</div>}</div>;}
function Row({label,children}){return <div style={{marginBottom:11}}><div style={{fontSize:11,fontWeight:600,color:"var(--muted)",marginBottom:4,letterSpacing:.6,textTransform:"uppercase"}}>{label}</div>{children}</div>;}
function DeleteBtn({onDelete,label="",style:ex}){const [open,setOpen]=useState(false);if(open)return(<div style={{display:"inline-flex",alignItems:"center",gap:6,background:"rgba(255,79,106,.1)",border:"1px solid rgba(255,79,106,.3)",borderRadius:8,padding:"4px 8px"}}><span style={{fontSize:12,color:"var(--danger)",fontWeight:600,whiteSpace:"nowrap"}}>Точно?</span><button onClick={onDelete} style={{padding:"3px 10px",borderRadius:6,border:"none",background:"var(--danger)",color:"#fff",fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:700,cursor:"pointer"}}>Так</button><button onClick={()=>setOpen(false)} style={{padding:"3px 8px",borderRadius:6,border:"1px solid var(--border2)",background:"var(--surface2)",color:"var(--muted)",fontFamily:"'DM Sans',sans-serif",fontSize:11,cursor:"pointer"}}>Ні</button></div>);return <button onClick={()=>setOpen(true)} style={{...btnD,...ex}}>🗑 {label}</button>;}

function App(){
  const [fbReady,setFbReady]=useState(!!window._fbReady);
  const [user,setUser]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const saveTimer=useRef(null);
  const [tab,setTab]=useState("dashboard");
  const [dark,setDark]=useState(()=>lsGet("padel_theme")!=="light");
  const [contacts,setContacts]=useState(()=>lsGet("padel_contacts")||[]);
  const [groups,setGroups]=useState(()=>lsGet("padel_groups")||[]);
  const [posts,setPosts]=useState(()=>lsGet("padel_posts")||[]);
  const [courts,setCourts]=useState(()=>lsGet("padel_courts")||[]);
  const [trainings,setTrainings]=useState(()=>lsGet("padel_trainings")||[]);
  const [notes,setNotes]=useState(()=>lsGet("padel_notes")||[]);
  const [toast,setToast]=useState("");
  const [modal,setModal]=useState(null);
  const [editItem,setEditItem]=useState(null);
  const [detailId,setDetailId]=useState(null);

  useEffect(()=>{document.body.className=dark?"":"light";lsSet("padel_theme",dark?"dark":"light");},[dark]);
  useEffect(()=>{if(window._fbReady){setFbReady(true);return;}const h=()=>setFbReady(true);window.addEventListener("fbReady",h);return()=>window.removeEventListener("fbReady",h);},[]);
  useEffect(()=>{if(!fbReady)return;const unsub=window._fb.onAuth(u=>{setUser(u);setAuthLoading(false);});return unsub;},[fbReady]);

  useEffect(()=>{
    if(!user)return;
    const unsub=window._fb.listen(user.uid,(data)=>{
      if(data.contacts){setContacts(data.contacts);lsSet("padel_contacts",data.contacts);}
      if(data.groups){setGroups(data.groups);lsSet("padel_groups",data.groups);}
      if(data.posts){setPosts(data.posts);lsSet("padel_posts",data.posts);}
      if(data.courts){setCourts(data.courts);lsSet("padel_courts",data.courts);}
      if(data.trainings){setTrainings(data.trainings);lsSet("padel_trainings",data.trainings);}
      if(data.notes){setNotes(data.notes);lsSet("padel_notes",data.notes);}
    });
    return unsub;
  },[user]);
  const cloudSave=useCallback((c,g,p,co,tr,n)=>{if(!user)return;clearTimeout(saveTimer.current);saveTimer.current=setTimeout(async()=>{try{await window._fb.save(user.uid,{contacts:c,groups:g,posts:p,courts:co,trainings:tr,notes:n});}catch(e){console.error(e);}},800);},[user]);

  const updC=(v)=>{setContacts(v);lsSet("padel_contacts",v);cloudSave(v,groups,posts,courts,trainings,notes);};
  const updG=(v)=>{setGroups(v);lsSet("padel_groups",v);cloudSave(contacts,v,posts,courts,trainings,notes);};
  const updP=(v)=>{setPosts(v);lsSet("padel_posts",v);cloudSave(contacts,groups,v,courts,trainings,notes);};
  const updCo=(v)=>{setCourts(v);lsSet("padel_courts",v);cloudSave(contacts,groups,posts,v,trainings,notes);};
  const updTr=(v)=>{setTrainings(v);lsSet("padel_trainings",v);cloudSave(contacts,groups,posts,courts,v,notes);};
  const updN=(v)=>{setNotes(v);lsSet("padel_notes",v);cloudSave(contacts,groups,posts,courts,trainings,v);};

  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(""),2200);};
  const remindDue=contacts.filter(c=>c.remindDate&&c.remindDate<=TODAY&&!c.remindDone).length+notes.filter(n=>n.remindDate&&n.remindDate<=TODAY&&!n.remindDone).length;
  const notesDue=notes.filter(n=>n.remindDate&&n.remindDate<=TODAY&&!n.remindDone).length;

  const openContact=(item)=>{setEditItem(item||null);setModal("contact");};
  const openGroup=(item)=>{setEditItem(item||null);setModal("group");};
  const openPost=(item)=>{setEditItem(item||null);setModal("post");};
  const openDetail=(c)=>{setDetailId(c.id);setModal("detail");};
  const closeModal=()=>{setModal(null);setEditItem(null);setDetailId(null);};
  const fabAction=()=>{
    if(tab==="contacts")openContact(null);
    else if(tab==="notes"){setEditItem({_new:true});setModal("note");}
    else if(tab==="groups")openGroup(null);
    else if(tab==="posts")openPost(null);
  };

  if(!fbReady||authLoading)return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:16}}><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:32,fontWeight:700,letterSpacing:4,color:"var(--accent)"}}>PADEL<span style={{color:"var(--accent2)"}}>CRM</span></div><div style={{color:"var(--muted)",fontSize:13}}>Завантаження...</div></div>);
  if(!user)return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:20,padding:24,background:"var(--bg)"}}>
      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:40,fontWeight:700,letterSpacing:4,color:"var(--accent)"}}>PADEL<span style={{color:"var(--accent2)"}}>CRM</span></div>
      <div style={{color:"var(--text2)",fontSize:14,textAlign:"center",maxWidth:280}}>Твоя особиста CRM для паделу.</div>
      <button onClick={()=>window._fb.signIn().catch(e=>alert("Помилка: "+e.message))}
        style={{display:"flex",alignItems:"center",gap:10,padding:"12px 24px",borderRadius:12,border:"1px solid var(--border2)",background:"var(--surface2)",color:"var(--text)",fontFamily:"'DM Sans',sans-serif",fontSize:14,fontWeight:600,cursor:"pointer"}}>
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
        Увійти через Google
      </button>
    </div>
  );

  return(
    <div style={{display:"flex",flexDirection:"column",minHeight:"100vh"}}>
      <header style={{background:"var(--surface)",borderBottom:"1px solid var(--border)",padding:"0 12px",height:52,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:700,letterSpacing:3,color:"var(--accent)"}}>PADEL<span style={{color:"var(--accent2)"}}>CRM</span></div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <button onClick={()=>setDark(d=>!d)} style={{background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:8,padding:"5px 9px",cursor:"pointer",fontSize:16,lineHeight:1,color:"var(--text)",display:"flex",alignItems:"center"}}>{dark?"[ Світла ]":"[ Темна ]"}</button>
          <div style={{width:7,height:7,borderRadius:"50%",background:"var(--accent2)",flexShrink:0}}/>
        </div>
      </header>
      <nav style={{background:"var(--surface)",borderBottom:"1px solid var(--border)",display:"flex",overflowX:"auto",position:"sticky",top:52,zIndex:99}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"10px 14px",border:"none",background:"none",color:tab===t.id?"var(--accent)":"var(--muted)",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600,cursor:"pointer",borderBottom:tab===t.id?"2px solid var(--accent)":"2px solid transparent",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:5}}>
            {t.icon} {t.label}
            {t.id==="reminders"&&remindDue>0&&<span style={{background:"#ff4f6a",color:"#fff",borderRadius:10,padding:"1px 5px",fontSize:10,fontWeight:700}}>{remindDue}</span>}
            {t.id==="notes"&&notesDue>0&&<span style={{background:"#b07fff",color:"#fff",borderRadius:10,padding:"1px 5px",fontSize:10,fontWeight:700}}>{notesDue}</span>}
          </button>
        ))}
      </nav>
      <main style={{flex:1,padding:tab==="calendar"?0:14,maxWidth:tab==="calendar"?"100%":860,margin:"0 auto",width:"100%"}}>
        {tab==="dashboard"&&<Dashboard contacts={contacts} groups={groups} onTabChange={setTab}/>}
        {tab==="calendar"&&<CalendarView courts={courts} trainings={trainings} onUpdateCourts={updCo} onUpdateTrainings={updTr} contacts={contacts} onOpenContact={openDetail} showToast={showToast}/>}
        {tab==="contacts"&&<Contacts contacts={contacts} onUpdate={updC} onOpen={openContact} onDetail={openDetail} showToast={showToast}/>}
        {tab==="reminders"&&<Reminders contacts={contacts} onUpdate={updC} notes={notes} onUpdateNotes={updN} showToast={showToast} onDetail={openDetail}/>}
        {tab==="notes"&&<Notes notes={notes} contacts={contacts} onUpdate={updN} showToast={showToast}/>}
        {tab==="groups"&&<Groups groups={groups} contacts={contacts} onUpdate={updG} onOpen={openGroup} showToast={showToast}/>}
        {tab==="posts"&&<Posts posts={posts} onUpdate={updP} onOpen={openPost} showToast={showToast}/>}
      </main>
      {tab!=="dashboard"&&tab!=="calendar"&&tab!=="reminders"&&<button onClick={fabAction} style={{position:"fixed",bottom:20,right:20,borderRadius:"50%",width:52,height:52,fontSize:26,display:"flex",alignItems:"center",justifyContent:"center",background:"var(--accent)",color:"var(--bg)",border:"none",cursor:"pointer",boxShadow:"0 4px 24px rgba(100,180,0,.35)",zIndex:90}}>+</button>}
      {modal==="contact"&&<ContactModal item={editItem} contacts={contacts} onClose={closeModal} onSave={v=>{updC(v);closeModal();showToast("Збережено ✓");}}/>}
      {modal==="group"&&<GroupModal item={editItem} groups={groups} contacts={contacts} onClose={closeModal} onSave={v=>{updG(v);closeModal();showToast("Збережено ✓");}}/>}
      {modal==="post"&&<PostModal item={editItem} posts={posts} onClose={closeModal} onSave={v=>{updP(v);closeModal();showToast("Пост збережено ✓");}}/>}
      {modal==="note"&&<NoteModal item={editItem||{_new:true}} contacts={contacts} notes={notes} onClose={closeModal} onSave={v=>{updN(v);closeModal();showToast("Збережено ✓");}}/>}
      {modal==="detail"&&<ContactDetail id={detailId} contacts={contacts} onClose={closeModal} onEdit={()=>{closeModal();const c=contacts.find(x=>x.id===detailId);openContact(c);}} onUpdate={updC} showToast={showToast}/>}
      {toast&&<div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:"var(--accent)",color:"var(--bg)",padding:"8px 18px",borderRadius:20,fontSize:13,fontWeight:600,zIndex:999,pointerEvents:"none",whiteSpace:"nowrap"}}>{toast}</div>}
    </div>
  );
}

function Dashboard({contacts,groups,onTabChange}){

  const chStats=CHANNELS.map(ch=>({...ch,count:contacts.filter(c=>c.channels?.includes(ch.id)).length})).filter(x=>x.count>0).sort((a,b)=>b.count-a.count);
  const stStats=STATUSES.map(s=>({...s,count:contacts.filter(c=>c.status===s.id).length}));

    <div>
      <div style={secTitle}>ДАШБОРД</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:16}}>
        {[{num:contacts.length,lbl:"Контактів",color:"var(--accent)"},{num:due.length,lbl:"Написати зараз",color:due.length>0?"var(--danger)":"var(--accent2)"},{num:wantGroup.length,lbl:"Хочуть в групу",color:"#b07fff"},{num:groups.length,lbl:"Груп",color:"var(--warn)"}].map((s,i)=>(
          <div key={i} style={card}><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:32,fontWeight:700,color:s.color,lineHeight:1}}>{s.num}</div><div style={{fontSize:11,color:"var(--muted)",marginTop:2}}>{s.lbl}</div></div>
        ))}

      {groups.length>0&&(<div style={card}><div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontWeight:600}}>🎾 Заповненість груп</span><span style={{color:"var(--accent)",fontWeight:700}}>{filledSpots}/{totalSpots}</span></div><ProgBar pct={fillPct}/><div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>{groups.map(g=>{const m=getMembers(g);const pct=g.max?Math.round(m.length/g.max*100):0;const col=pct>=100?"var(--danger)":pct>=75?"var(--warn)":"var(--accent2)";return(<div key={g.id}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span>{g.name}</span><span style={{color:col}}>{m.length}/{g.max}</span></div><ProgBar pct={pct} color={col} h={4}/></div>);})}</div></div>)}
      <div style={card}><div style={{fontWeight:600,marginBottom:10}}>👥 Статуси контактів</div>{stStats.filter(s=>s.count>0).map(s=>(<div key={s.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}><span style={{width:110,fontSize:12,color:s.color,fontWeight:600}}>{s.label}</span><div style={{flex:1,height:8,borderRadius:4,background:"var(--surface2)",overflow:"hidden"}}><div style={{height:"100%",borderRadius:4,background:s.color,width:contacts.length?(s.count/contacts.length*100)+"%":"0%",transition:"width .3s"}}/></div><span style={{fontSize:12,color:"var(--muted)",width:20,textAlign:"right"}}>{s.count}</span></div>))}</div>
      {chStats.length>0&&(<div style={card}><div style={{fontWeight:600,marginBottom:10}}>📱 Звідки клієнти</div><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{chStats.map(ch=>(<div key={ch.id} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",background:"var(--surface2)",borderRadius:8,border:`1px solid ${ch.color}30`}}><span>{ch.emoji}</span><span style={{fontWeight:600,fontSize:13}}>{ch.label}</span><span style={{color:ch.color,fontWeight:700,fontSize:15}}>{ch.count}</span></div>))}</div></div>)}
      {wantGroup.length>0&&(<div style={{...card,borderColor:"rgba(176,127,255,.25)"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontWeight:600,color:"#b07fff"}}>🎾 Хочуть в групу ({wantGroup.length})</span><button style={btnG} onClick={()=>onTabChange("groups")}>Групи →</button></div>{wantGroup.map(c=>(<div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:"1px solid var(--border)",fontSize:13}}><span style={{flex:1,fontWeight:500}}>{c.name}</span>{c.level&&<span style={{color:"var(--muted)",fontSize:11}}>{c.level}</span>}</div>))}</div>)}

            <button style={iconBtn} onClick={()=>onOpen(c)}>✏️</button>
          </div>
          {c.note&&<div style={{marginTop:8,fontSize:13,color:"var(--text2)",lineHeight:1.55,cursor:"pointer"}} onClick={()=>onDetail(c)}>{c.note.slice(0,120)}{c.note.length>120?"...":""}</div>}
          {c.remindDate&&!c.remindDone&&<div style={{display:"inline-flex",alignItems:"center",gap:4,background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:6,padding:"3px 8px",fontSize:11,color:c.remindDate<=TODAY?"var(--danger)":"var(--warn)",marginTop:5}}>🔔 {c.remindDate<=TODAY?"⚠️ Написати!":"Написати: "+formatDate(c.remindDate)}</div>}

            {c.remindDate&&!c.remindDone&&<button style={btnT} onClick={()=>markW(c.id)}>✅ Написав</button>}
            <DeleteBtn onDelete={()=>del(c.id)} label=""/>

  const delNote=(hid)=>onUpdate(contacts.map(x=>x.id===id?{...x,history:(x.history||[]).filter(h=>h.id!==hid)}:x));

    <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={modal}>
        <div style={modalTitle}><span>{c.name}</span><div style={{display:"flex",gap:8}}><button style={btnG} onClick={onEdit}>✏️</button><button style={{background:"none",border:"none",color:"var(--muted)",fontSize:20,cursor:"pointer"}} onClick={onClose}>✕</button></div></div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}><StatusPill status={c.status}/>{c.channels?.map(ch=><ChannelChip key={ch} channel={ch}/>)}</div>

        {c.chatLink&&<a href={c.chatLink} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:6,color:"#4a9ef4",fontSize:13,marginBottom:10,textDecoration:"none",padding:"4px 10px",background:"rgba(74,158,244,.1)",borderRadius:8,border:"1px solid rgba(74,158,244,.25)"}}>Перейти в чат</a>}
        {c.note&&<div style={{marginBottom:14}}><div style={{fontSize:11,fontWeight:600,color:"var(--muted)",textTransform:"uppercase",letterSpacing:.6,marginBottom:6}}>Нотатка</div><div style={{background:"var(--surface2)",borderRadius:8,padding:10,color:"var(--text2)",fontSize:13,lineHeight:1.55}}>{c.note}</div></div>}
        {c.remindDate&&!c.remindDone&&<div style={{background:"rgba(255,184,48,.08)",border:"1px solid rgba(255,184,48,.2)",borderRadius:8,padding:10,marginBottom:14}}><span style={{color:"var(--warn)",fontSize:13,fontWeight:600}}>🔔 Написати: {formatDate(c.remindDate)}</span></div>}
        <div style={{height:1,background:"var(--border)",margin:"14px 0"}}/>
        <div style={{fontSize:11,fontWeight:600,color:"var(--muted)",textTransform:"uppercase",letterSpacing:.6,marginBottom:10}}>Історія спілкування</div>
        {(!c.history||!c.history.length)&&<div style={{color:"var(--muted)",fontSize:12,marginBottom:10}}>Поки нічого немає</div>}
        {(c.history||[]).map(h=>(<div key={h.id} style={{padding:"8px 10px",borderRadius:8,background:"var(--surface2)",border:"1px solid var(--border)",marginBottom:6}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:11,color:"var(--muted)",marginBottom:3}}><span style={{display:"flex",gap:6,alignItems:"center"}}>{formatDate(h.date)} {h.channel&&<ChannelChip channel={h.channel}/>}</span><button style={iconBtn} onClick={()=>delNote(h.id)}>🗑</button></div><div style={{fontSize:13,color:"var(--text2)"}}>{h.text}</div></div>))}
        <div style={{display:"flex",gap:6,marginTop:8}}><textarea style={{...inp,minHeight:48,flex:1}} placeholder="Додати запис про спілкування..." value={newNote} onChange={e=>setNewNote(e.target.value)}/><button style={{...btnP,alignSelf:"flex-end"}} onClick={addNote}>+</button></div>

function ContactModal({item,contacts,onClose,onSave}){
  const [form,setForm]=useState(item||{id:uid(),name:"",channels:[],status:"new",level:"",note:"",contact:"",remindDate:"",remindDone:false,history:[]});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const tgCh=(id)=>set("channels",(form.channels||[]).includes(id)?(form.channels||[]).filter(c=>c!==id):[...(form.channels||[]),id]);
  const save=()=>{if(!form.name.trim()){alert("Введи ім'я!");return;}onSave(item?contacts.map(c=>c.id===item.id?{...form}:c):[{...form},...contacts]);};
  return(
    <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={modal}>
        <div style={modalTitle}><span>{item?"Редагувати":"Новий контакт"}</span><button style={{background:"none",border:"none",color:"var(--muted)",fontSize:20,cursor:"pointer"}} onClick={onClose}>✕</button></div>
        <Row label="Ім'я *"><input style={inp} placeholder="Ім'я та прізвище" value={form.name} onChange={e=>set("name",e.target.value)}/></Row>
        <Row label="Де спілкуємось"><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{CHANNELS.map(ch=>{const s=(form.channels||[]).includes(ch.id);return <button key={ch.id} onClick={()=>tgCh(ch.id)} style={{padding:"6px 12px",borderRadius:8,border:`1px solid ${s?ch.color:"var(--border2)"}`,background:s?"rgba(200,241,53,.08)":"var(--surface2)",color:s?ch.color:"var(--muted)",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600,cursor:"pointer"}}>{ch.emoji} {ch.label}</button>;})}</div></Row>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><Row label="Статус"><select style={inp} value={form.status} onChange={e=>set("status",e.target.value)}>{STATUSES.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select></Row><Row label="Рівень"><select style={inp} value={form.level} onChange={e=>set("level",e.target.value)}><option value="">Невідомо</option>{LEVELS.map(l=><option key={l}>{l}</option>)}</select></Row></div>
        <Row label="Нотатка"><textarea style={{...inp,minHeight:64}} placeholder="Хоче групове, жде набору..." value={form.note} onChange={e=>set("note",e.target.value)}/></Row>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><Row label="Телефон / Нікнейм"><input style={inp} placeholder="+380..." value={form.contact} onChange={e=>set("contact",e.target.value)}/></Row><Row label="Написати до"><input style={inp} type="date" value={form.remindDate} onChange={e=>{set("remindDate",e.target.value);set("remindDone",false);}}/></Row></div>
        <Row label="Посилання на чат"><input style={inp} placeholder="https://t.me/username або https://wa.me/380..." value={form.chatLink||""} onChange={e=>set("chatLink",e.target.value)}/></Row>
        <div style={{display:"flex",gap:8,marginTop:4}}><button style={{...btnP,flex:1}} onClick={save}>Зберегти</button><button style={btnG} onClick={onClose}>Скасувати</button></div>
      </div>
    </div>
  );
}

function Reminders({contacts,onUpdate,notes,onUpdateNotes,showToast,onDetail}){
  const withR=contacts.filter(c=>c.remindDate&&!c.remindDone).sort((a,b)=>a.remindDate.localeCompare(b.remindDate));
  const withNR=(notes||[]).filter(n=>n.remindDate&&!n.remindDone).sort((a,b)=>a.remindDate.localeCompare(b.remindDate));
  const tagged=(arr,kind)=>arr.map(x=>({...x,_kind:kind}));
  const merge=(a,b)=>[...tagged(a,"contact"),...tagged(b,"note")].sort((x,y)=>x.remindDate.localeCompare(y.remindDate));
  const allOverdue=merge(withR.filter(c=>c.remindDate<TODAY),withNR.filter(n=>n.remindDate<TODAY));
  const allToday=merge(withR.filter(c=>c.remindDate===TODAY),withNR.filter(n=>n.remindDate===TODAY));
  const allUpcoming=merge(withR.filter(c=>c.remindDate>TODAY),withNR.filter(n=>n.remindDate>TODAY));
  const total=allOverdue.length+allToday.length+allUpcoming.length;
  const markContactDone=(id)=>{onUpdate(contacts.map(c=>c.id===id?{...c,remindDone:true,remindDate:null}:c));showToast("Позначено ✓");};
  const markNoteDone=(id)=>{onUpdateNotes((notes||[]).map(n=>n.id===id?{...n,remindDone:true}:n));showToast("Позначено ✓");};
  const ItemCard=({item,color})=>{
    const isNote=item._kind==="note";
    const nt=isNote?getNoteType(item.type):null;
    return(
      <div style={{display:"flex",alignItems:"flex-start",gap:10,padding:11,borderRadius:10,border:`1px solid ${color}30`,background:`${color}08`,marginBottom:8}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            {isNote&&<span style={{fontSize:14}}>{nt.emoji}</span>}
            <span style={{fontWeight:600,fontSize:14,cursor:"pointer",color:"var(--text)"}} onClick={()=>!isNote&&onDetail(item)}>{isNote?(item.title||"Замітка"):item.name}</span>
            {isNote?<span style={{padding:"1px 7px",borderRadius:12,fontSize:10,fontWeight:700,background:`${nt.color}18`,color:nt.color}}>{nt.label}</span>:<StatusPill status={item.status}/>}
          </div>
          {!isNote&&item.channels?.length>0&&<div style={{display:"flex",gap:4,marginTop:4}}>{item.channels.map(ch=><ChannelChip key={ch} channel={ch}/>)}</div>}
          {isNote&&item.body&&<div style={{color:"var(--text2)",fontSize:12,marginTop:4,lineHeight:1.4}}>{item.body.slice(0,80)}</div>}
          {!isNote&&item.note&&<div style={{color:"var(--text2)",fontSize:12,marginTop:4}}>{item.note.slice(0,80)}</div>}
          <div style={{color,fontSize:10,marginTop:3,fontWeight:600}}>{formatDate(item.remindDate)}</div>
        </div>
        <button style={btnT} onClick={()=>isNote?markNoteDone(item.id):markContactDone(item.id)}>✅</button>
      </div>
    );
  };
  const Sec=({items,color,title})=>{if(!items.length)return null;return(<><div style={{color,fontWeight:700,fontSize:12,letterSpacing:1,marginBottom:8}}>{title} ({items.length})</div>{items.map(item=><ItemCard key={item.id+(item._kind||"")} item={item} color={color}/>)}<div style={{height:1,background:"var(--border)",margin:"14px 0"}}/></>);};
  if(!total)return(<div><div style={secTitle}>НАГАДУВАННЯ</div><Empty icon="🎉" text="Нагадувань немає!" sub="Ти всім написав."/></div>);
  return(
    <div>
      <div style={secTitle}>НАГАДУВАННЯ <span style={{color:"var(--muted)",fontSize:16}}>({total})</span></div>
      <Sec items={allOverdue} color="#ff4f6a" title="⚠️ ПРОСТРОЧЕНО"/>
      <Sec items={allToday} color="#ffb830" title="🔥 СЬОГОДНІ"/>
      <Sec items={allUpcoming} color="#4af0b0" title="📅 ЗАПЛАНОВАНО"/>
    </div>
  );
}

function Notes({notes,contacts,onUpdate,showToast}){
  const [filter,setFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [editNote,setEditNote]=useState(null);
  const filtered=notes.filter(n=>{
    const mf=filter==="all"||n.type===filter||(filter==="due"&&n.remindDate&&n.remindDate<=TODAY&&!n.remindDone);
    const ms=!search||(n.title||"").toLowerCase().includes(search.toLowerCase())||(n.body||"").toLowerCase().includes(search.toLowerCase());
    return mf&&ms;
  }).sort((a,b)=>{if(a.pinned&&!b.pinned)return -1;if(!a.pinned&&b.pinned)return 1;return(b.createdAt||0)-(a.createdAt||0);});
  const del=(id)=>{onUpdate(notes.filter(n=>n.id!==id));showToast("Видалено");};
  const toggleDone=(id)=>{onUpdate(notes.map(n=>n.id===id?{...n,done:!n.done}:n));};
  const togglePin=(id)=>{onUpdate(notes.map(n=>n.id===id?{...n,pinned:!n.pinned}:n));};
  const markRemindDone=(id)=>{onUpdate(notes.map(n=>n.id===id?{...n,remindDone:true}:n));showToast("Нагадування знято ✓");};
  const dueCount=notes.filter(n=>n.remindDate&&n.remindDate<=TODAY&&!n.remindDone).length;
  return(
    <div>
      <div style={secTitle}>ЗАМІТКИ <span style={{color:"var(--muted)",fontSize:16}}>({notes.length})</span></div>
      <div style={{position:"relative",marginBottom:12}}><span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"var(--muted)",fontSize:13,pointerEvents:"none"}}>🔍</span><input style={{...inp,paddingLeft:32}} placeholder="Пошук по замітках..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
        <button style={filter==="all"?fOn:fOff} onClick={()=>setFilter("all")}>Всі ({notes.length})</button>
        {dueCount>0&&<button style={filter==="due"?{...fOn,borderColor:"#b07fff",color:"#b07fff"}:fOff} onClick={()=>setFilter("due")}>🔔 Нагадування ({dueCount})</button>}
        {NOTE_TYPES.map(t=>{const cnt=notes.filter(n=>n.type===t.id).length;if(!cnt)return null;return <button key={t.id} style={filter===t.id?fOn:fOff} onClick={()=>setFilter(t.id)}>{t.emoji} {t.label} ({cnt})</button>;})}
      </div>
      {filtered.length===0&&<Empty icon="📝" text="Заміток немає" sub="Натисни + щоб додати"/>}
      {filtered.map(n=>{
        const nt=getNoteType(n.type);
        const overdue=n.remindDate&&n.remindDate<TODAY&&!n.remindDone;
        const dueToday=n.remindDate&&n.remindDate===TODAY&&!n.remindDone;
        const linkedContacts=(n.contactIds||[]).map(id=>contacts.find(c=>c.id===id)).filter(Boolean);
        return(
          <div key={n.id} style={{...card,borderColor:n.pinned?"rgba(200,241,53,.3)":overdue?"rgba(255,79,106,.25)":dueToday?"rgba(255,184,48,.25)":"var(--border)",opacity:n.done?.5:1}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
              <span style={{fontSize:16,flexShrink:0,marginTop:1}}>{nt.emoji}</span>
              <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>setEditNote(n)}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  {n.pinned&&<span style={{fontSize:10,color:"var(--accent)"}}>📌</span>}
                  <span style={{fontWeight:600,fontSize:15,color:n.done?"var(--muted)":"var(--text)",textDecoration:n.done?"line-through":"none"}}>{n.title||"Без назви"}</span>
                  <span style={{padding:"1px 7px",borderRadius:12,fontSize:10,fontWeight:700,background:`${nt.color}18`,color:nt.color}}>{nt.label}</span>
                </div>
                {n.body&&<div style={{fontSize:13,color:"var(--text2)",marginTop:4,lineHeight:1.5,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{n.body}</div>}
              </div>
              <div style={{display:"flex",gap:4,flexShrink:0}}>
                <button onClick={()=>togglePin(n.id)} style={{...iconBtn,color:n.pinned?"var(--accent)":"var(--muted)"}}>📌</button>
                <button onClick={()=>setEditNote(n)} style={iconBtn}>✏️</button>
              </div>
            </div>
            {n.remindDate&&!n.remindDone&&(
              <div style={{display:"inline-flex",alignItems:"center",gap:6,marginTop:8,padding:"4px 10px",borderRadius:8,background:overdue?"rgba(255,79,106,.1)":dueToday?"rgba(255,184,48,.1)":"rgba(74,240,176,.08)",border:`1px solid ${overdue?"rgba(255,79,106,.3)":dueToday?"rgba(255,184,48,.3)":"rgba(74,240,176,.2)"}`}}>
                <span style={{fontSize:11,color:overdue?"var(--danger)":dueToday?"var(--warn)":"var(--accent2)",fontWeight:600}}>🔔 {overdue?"⚠️ Прострочено":dueToday?"Сьогодні":formatDate(n.remindDate)}</span>
                <button onClick={()=>markRemindDone(n.id)} style={{background:"none",border:"none",color:"var(--accent2)",cursor:"pointer",fontSize:11,fontWeight:700,padding:0}}>✓ Знято</button>
              </div>
            )}
            {(linkedContacts.length>0||(n.extraNames||[]).filter(Boolean).length>0)&&(
              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:8}}>
                {linkedContacts.map(c=>(<span key={c.id} style={{padding:"2px 8px",borderRadius:12,fontSize:11,fontWeight:600,background:"var(--surface2)",border:"1px solid var(--border2)",color:"var(--text2)"}}>👤 {c.name}</span>))}
                {(n.extraNames||[]).filter(Boolean).map((name,i)=>(<span key={"ex"+i} style={{padding:"2px 8px",borderRadius:12,fontSize:11,fontWeight:600,background:"rgba(74,158,244,.1)",border:"1px solid rgba(74,158,244,.3)",color:"#4a9ef4"}}>👤 {name}</span>))}
              </div>
            )}
            <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>
              <button onClick={()=>toggleDone(n.id)} style={{...btnT,fontSize:11,padding:"4px 10px",background:n.done?"rgba(107,115,148,.15)":"rgba(74,240,176,.12)",color:n.done?"var(--muted)":"var(--accent2)"}}>{n.done?"↩ Відновити":"✓ Виконано"}</button>
              <DeleteBtn onDelete={()=>del(n.id)} label=""/>
            </div>
          </div>
        );
      })}
      {editNote&&<NoteModal item={editNote} contacts={contacts} notes={notes} onClose={()=>setEditNote(null)} onSave={v=>{onUpdate(v);setEditNote(null);showToast("Збережено ✓");}}/>}
    </div>
  );
}

function NoteModal({item,contacts,notes,onClose,onSave}){
  const isNew=!item||item._new;
  const [form,setForm]=useState({id:item?.id||uid(),type:item?.type||"note",title:item?.title||"",body:item?.body||"",remindDate:item?.remindDate||"",remindDone:item?.remindDone||false,contactIds:item?.contactIds||[],extraNames:item?.extraNames||[],pinned:item?.pinned||false,done:item?.done||false,createdAt:item?.createdAt||Date.now(),_new:isNew});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const toggleContact=(id)=>{const ids=form.contactIds||[];set("contactIds",ids.includes(id)?ids.filter(x=>x!==id):[...ids,id]);};
  const [showContacts,setShowContacts]=useState(false);
  const [contactSearch,setContactSearch]=useState("");
  const filteredContacts=contacts.filter(c=>c.name.toLowerCase().includes(contactSearch.toLowerCase()));
  const save=()=>{
    if(!form.title.trim()&&!form.body.trim()){alert("Додай текст або назву!");return;}
    const {_new,...clean}=form;
    const exists=notes.find(n=>n.id===form.id);
    onSave(exists?notes.map(n=>n.id===form.id?clean:n):[{...clean},...notes]);
  };
  const nt=getNoteType(form.type);
  const quickDate=(days)=>{const d=new Date();d.setDate(d.getDate()+days);set("remindDate",d.toISOString().slice(0,10));set("remindDone",false);};
  return(
    <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={modal}>
        <div style={modalTitle}><span style={{fontSize:15}}>{isNew?"Нова замітка":"Редагувати"}</span><button style={{background:"none",border:"none",color:"var(--muted)",fontSize:20,cursor:"pointer"}} onClick={onClose}>✕</button></div>
        <Row label="Тип"><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{NOTE_TYPES.map(t=>{const sel=form.type===t.id;return(<button key={t.id} onClick={()=>set("type",t.id)} style={{padding:"5px 12px",borderRadius:20,border:`1px solid ${sel?t.color:"var(--border2)"}`,background:sel?`${t.color}18`:"var(--surface2)",color:sel?t.color:"var(--muted)",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600,cursor:"pointer"}}>{t.emoji} {t.label}</button>);})}</div></Row>
        <Row label="Назва"><input style={inp} placeholder="Коротка назва..." value={form.title} onChange={e=>set("title",e.target.value)}/></Row>
        <Row label="Текст"><textarea style={{...inp,minHeight:88}} placeholder="Деталі, думки, інформація..." value={form.body} onChange={e=>set("body",e.target.value)}/></Row>
        <Row label="🔔 Нагадування">
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <input type="date" style={{...inp,flex:1}} value={form.remindDate} onChange={e=>{set("remindDate",e.target.value);set("remindDone",false);}}/>
            {form.remindDate&&<button onClick={()=>{set("remindDate","");set("remindDone",false);}} style={{...btnD,padding:"6px 10px",flexShrink:0}}>✕</button>}
          </div>
          <div style={{display:"flex",gap:5,marginTop:6,flexWrap:"wrap"}}>
            <button style={{...btnG,fontSize:11,padding:"3px 10px"}} onClick={()=>quickDate(0)}>Сьогодні</button>
            <button style={{...btnG,fontSize:11,padding:"3px 10px"}} onClick={()=>quickDate(1)}>Завтра</button>
            <button style={{...btnG,fontSize:11,padding:"3px 10px"}} onClick={()=>quickDate(7)}>За тиждень</button>
          </div>
        </Row>
        <Row label="👥 Контакти">
          <button onClick={()=>setShowContacts(s=>!s)} style={{...btnG,width:"100%",justifyContent:"space-between",display:"flex",alignItems:"center",marginBottom:6}}>
            <span>{(form.contactIds.length+(form.extraNames||[]).filter(Boolean).length)>0?`Вибрано: ${form.contactIds.length+(form.extraNames||[]).filter(Boolean).length}`:"Додати контакти"}</span>
            <span>{showContacts?"▲":"▼"}</span>
          </button>
          {form.contactIds.length>0&&<div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:6}}>{form.contactIds.map(id=>{const c=contacts.find(x=>x.id===id);if(!c)return null;return(<span key={id} style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:600,background:"var(--surface2)",border:"1px solid var(--border2)",color:"var(--text2)"}}>👤 {c.name}<button onClick={()=>toggleContact(id)} style={{background:"none",border:"none",color:"var(--danger)",cursor:"pointer",fontSize:11}}>✕</button></span>);})}</div>}
          {(form.extraNames||[]).filter(Boolean).length>0&&<div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:6}}>{(form.extraNames||[]).map((name,i)=>name?(<span key={i} style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:600,background:"rgba(74,158,244,.1)",border:"1px solid rgba(74,158,244,.3)",color:"#4a9ef4"}}>👤 {name}<button onClick={()=>{const a=[...(form.extraNames||[])];a.splice(i,1);set("extraNames",a);}} style={{background:"none",border:"none",color:"var(--danger)",cursor:"pointer",fontSize:11}}>✕</button></span>):null)}</div>}
          {showContacts&&(
            <div style={{background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:10,padding:8}}>
              <div style={{display:"flex",gap:6,marginBottom:8}}>
                <input style={{...inp,flex:1,fontSize:12}} placeholder="Ім'я вручну (не з контактів)..." id="extra-name-inp" onKeyDown={e=>{if(e.key==="Enter"&&e.target.value.trim()){set("extraNames",[...(form.extraNames||[]),e.target.value.trim()]);e.target.value=("");}}}/>
                <button style={{...btnT,padding:"5px 10px",flexShrink:0}} onClick={()=>{const el=document.getElementById("extra-name-inp");if(el&&el.value.trim()){set("extraNames",[...(form.extraNames||[]),el.value.trim()]);el.value="";}}}>+ Додати</button>
              </div>
              <input style={{...inp,marginBottom:6,fontSize:12}} placeholder="Пошук в контактах CRM..." value={contactSearch} onChange={e=>setContactSearch(e.target.value)}/>
              <div style={{maxHeight:150,overflowY:"auto"}}>
                {filteredContacts.map(c=>{const sel=(form.contactIds||[]).includes(c.id);return(<div key={c.id} onClick={()=>toggleContact(c.id)} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",borderRadius:6,cursor:"pointer",background:sel?"rgba(200,241,53,.08)":"transparent",marginBottom:2}}><div style={{width:16,height:16,borderRadius:4,border:`2px solid ${sel?"var(--accent)":"var(--border2)"}`,background:sel?"var(--accent)":"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"var(--bg)"}}>{sel&&"✓"}</div><span style={{fontSize:13,color:"var(--text)"}}>{c.name}</span></div>);})}
                {filteredContacts.length===0&&<div style={{color:"var(--muted)",fontSize:12,textAlign:"center",padding:8}}>Не знайдено</div>}
              </div>
            </div>
          )}
        </Row>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
          <button onClick={()=>set("pinned",!form.pinned)} style={{width:22,height:22,borderRadius:6,border:`2px solid ${form.pinned?"var(--accent)":"var(--border2)"}`,background:form.pinned?"rgba(200,241,53,.15)":"var(--surface2)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>{form.pinned&&<span style={{color:"var(--accent)"}}>✓</span>}</button>
          <span style={{fontSize:13,color:form.pinned?"var(--accent)":"var(--muted)",fontWeight:600}}>📌 Закріпити замітку</span>
        </div>
        <div style={{display:"flex",gap:8}}><button style={{...btnP,flex:1}} onClick={save}>Зберегти</button><button style={btnG} onClick={onClose}>Скасувати</button></div>
      </div>
    </div>
  );
}

function CalendarView({courts,trainings,onUpdateCourts,onUpdateTrainings,contacts,onOpenContact,showToast}){
  const [weekOffset,setWeekOffset]=useState(0);
  const [courtModal,setCourtModal]=useState(null);
  const [trainModal,setTrainModal]=useState(null);
  const dates=getWeekDates(weekOffset);
  const CELL_H=60,TIME_W=48,COURT_W=80,TRAIN_W=130;
  const fmt=(d)=>{const dt=new Date(d+"T00:00:00");return DAY_NAMES_SHORT[(dt.getDay()+6)%7]+" "+dt.getDate()+" "+MONTH_NAMES[dt.getMonth()];};
  const rangeLabel=fmt(dates[0])+" – "+fmt(dates[6]);
  const totalH=HOURS.length*CELL_H;
  const topPx=(hour)=>(hour-HOURS[0])*CELL_H;
  const courtCovers=(date,h)=>courts.some(c=>c.date===date&&c.hour<=h&&h<c.hour+(c.duration||1));
  const trainCovers=(date,h)=>trainings.some(t=>t.date===date&&t.hour<=h&&h<t.hour+(t.duration||1));
  const saveCourt=(b)=>{const{isNew,...clean}=b;const ex=courts.find(x=>x.id===b.id);onUpdateCourts(ex?courts.map(x=>x.id===b.id?clean:x):[...courts,{...clean,id:clean.id||uid()}]);setCourtModal(null);showToast("Збережено ✓");};
  const deleteCourt=(id)=>{onUpdateCourts(courts.filter(c=>c.id!==id));setCourtModal(null);showToast("Видалено");};
  const saveTrain=(b)=>{const{isNew,...clean}=b;const ex=trainings.find(x=>x.id===b.id);onUpdateTrainings(ex?trainings.map(x=>x.id===b.id?clean:x):[...trainings,{...clean,id:clean.id||uid()}]);setTrainModal(null);showToast("Збережено ✓");};
  const deleteTrain=(id)=>{onUpdateTrainings(trainings.filter(t=>t.id!==id));setTrainModal(null);showToast("Видалено");};
  const gridCols=`${TIME_W}px `+dates.map(()=>`${COURT_W}px ${TRAIN_W}px`).join(" ");
  return(
    <div style={{margin:0,display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 14px 4px",flexWrap:"wrap",gap:6}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:700,letterSpacing:2,color:"var(--accent)"}}>КАЛЕНДАР</div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <button style={iconBtn} onClick={()=>setWeekOffset(w=>w-1)}>‹</button>
          <span style={{fontSize:12,fontWeight:600,color:"var(--text)",minWidth:190,textAlign:"center"}}>{rangeLabel}</span>
          <button style={iconBtn} onClick={()=>setWeekOffset(w=>w+1)}>›</button>
          <button style={{...btnG,fontSize:11,padding:"4px 10px"}} onClick={()=>setWeekOffset(0)}>Сьогодні</button>
        </div>
      </div>
      <div style={{overflowX:"auto",overflowY:"auto",maxHeight:"calc(100vh - 150px)",WebkitOverflowScrolling:"touch"}}>
        <div style={{minWidth:TIME_W+(COURT_W+TRAIN_W)*7,position:"relative"}}>
          <div style={{display:"grid",gridTemplateColumns:gridCols,position:"sticky",top:0,zIndex:40,background:"var(--bg)",borderBottom:"2px solid var(--border)"}}>
            <div style={{borderRight:"1px solid var(--border)"}}/>
            {dates.map((d,i)=>{const today=d===TODAY;const dt=new Date(d+"T00:00:00");return(
              <React.Fragment key={d}>
                <div style={{gridColumn:"span 2",borderLeft:"1px solid var(--border)",display:"flex",flexDirection:"column"}}>
                  <div style={{textAlign:"center",padding:"5px 4px 2px",borderBottom:"1px solid var(--border2)",background:today?"rgba(200,241,53,.07)":"transparent"}}>
                    <span style={{fontSize:10,color:"var(--muted)"}}>{DAY_NAMES_SHORT[i]} </span>
                    <span style={{fontSize:13,fontWeight:700,color:today?"var(--accent)":"var(--text)"}}>{dt.getDate()} {MONTH_NAMES[dt.getMonth()]}</span>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:`${COURT_W}px ${TRAIN_W}px`}}>
                    <div style={{fontSize:9,color:"var(--muted)",textAlign:"center",padding:"2px 0",borderRight:"1px solid var(--border)"}}>КОРТ</div>
                    <div style={{fontSize:9,color:"var(--muted)",textAlign:"center",padding:"2px 0"}}>ТРЕНУВАННЯ</div>
                  </div>
                </div>
              </React.Fragment>
            );})}
          </div>
          <div style={{display:"grid",gridTemplateColumns:gridCols}}>
            <div style={{borderRight:"1px solid var(--border)"}}>
              {HOURS.map(h=>(<div key={h} style={{height:CELL_H,display:"flex",alignItems:"flex-start",justifyContent:"flex-end",padding:"4px 6px 0",borderBottom:"1px solid var(--cal-line)"}}><span style={{fontSize:11,color:"var(--muted)",fontWeight:600,whiteSpace:"nowrap"}}>{String(h).padStart(2,"0")}:00</span></div>))}
            </div>
            {dates.map(date=>(
              <React.Fragment key={date}>
                <div style={{borderLeft:"1px solid var(--border)",borderRight:"1px solid var(--border)",position:"relative",height:totalH,background:"rgba(255,255,255,.005)"}}>
                  {HOURS.map((h,i)=>(<div key={h} style={{position:"absolute",top:i*CELL_H,left:0,right:0,height:CELL_H,borderBottom:"1px solid var(--cal-line)",pointerEvents:"none"}}/>))}
                  {HOURS.map((h,i)=>courtCovers(date,h)?null:(<button key={h} onClick={()=>setCourtModal({date,hour:h,isNew:true})} style={{position:"absolute",top:i*CELL_H,left:0,width:"100%",height:CELL_H,background:"transparent",border:"none",color:"var(--border2)",fontSize:16,cursor:"pointer",opacity:.5,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>))}
                  {courts.filter(c=>c.date===date).map(c=>{const ct=getCourt(c.court);const dur=c.duration||1;const color=ct?ct.color:"var(--accent2)";return(<div key={c.id} onClick={()=>setCourtModal({...c,isNew:false})} style={{position:"absolute",top:topPx(c.hour)+2,left:2,right:2,height:dur*CELL_H-4,background:`${color||"#4af0b0"}20`,border:`1px solid ${color||"#4af0b0"}50`,borderLeft:`3px solid ${color||"#4af0b0"}`,borderRadius:5,padding:"3px 5px",cursor:"pointer",overflow:"hidden",zIndex:2,boxSizing:"border-box"}}><div style={{fontSize:10,fontWeight:700,color:color||"#4af0b0",lineHeight:1.2}}>{ct?ct.label:"Корт"}</div>{c.courtNum&&<div style={{fontSize:9,opacity:.8,color:color||"#4af0b0"}}>№{c.courtNum}</div>}{dur>1&&<div style={{fontSize:9,color:"var(--muted)",marginTop:1}}>{dur} год</div>}</div>);})}
                </div>
                <div style={{position:"relative",height:totalH}}>
                  {HOURS.map((h,i)=>(<div key={h} style={{position:"absolute",top:i*CELL_H,left:0,right:0,height:CELL_H,borderBottom:"1px solid var(--cal-line)",pointerEvents:"none"}}/>))}
                  {HOURS.map((h,i)=>trainCovers(date,h)?null:(<button key={h} onClick={()=>setTrainModal({date,hour:h,isNew:true})} style={{position:"absolute",top:i*CELL_H,left:0,width:"100%",height:CELL_H,background:"transparent",border:"none",color:"var(--border2)",fontSize:16,cursor:"pointer",opacity:.5,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>))}
                  {trainings.filter(t=>t.date===date).map(t=>{
  const tt=getTrainType(t.type);const dur=t.duration||1;const grpP=(t.players||[]).filter(Boolean);
  const findC=(name)=>contacts.find(c=>c.name===name);
  const PName=({name,paid,size=10})=>{
    const c=findC(name);
    return(
      <div style={{fontSize:size,color:"var(--text)",display:"flex",alignItems:"center",gap:3,marginTop:1,lineHeight:1.3}}>
        <span style={{color:paid?"var(--accent2)":"var(--danger)",fontSize:size-1,flexShrink:0}}>{paid?"✓":"✗"}</span>
        {c
          ?<span onClick={e=>{e.stopPropagation();onOpenContact&&onOpenContact(c);}}
              style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",
                color:"var(--accent2)",textDecoration:"underline dotted",cursor:"pointer"}}>
              {name}
            </span>
          :<span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{name}</span>
        }
      </div>
    );
  };
  return(
    <div key={t.id} onClick={()=>setTrainModal({...t,isNew:false})}
      style={{position:"absolute",top:topPx(t.hour)+2,left:2,right:2,height:dur*CELL_H-4,
        background:tt.bg,border:`1px solid ${tt.color}50`,borderLeft:`3px solid ${tt.color}`,
        borderRadius:5,padding:"3px 5px",cursor:"pointer",overflow:"hidden",zIndex:2,boxSizing:"border-box"}}>
      <div style={{fontSize:10,fontWeight:700,color:tt.color,lineHeight:1.3}}>{tt.label}</div>
      {t.note&&<div style={{fontSize:9,color:"var(--text2)",lineHeight:1.3,marginTop:1,fontStyle:"italic",overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{t.note}</div>}
      {t.player&&<PName name={t.player} paid={t.paid}/>}
      {grpP.map((p,i)=>(
        <div key={i} style={{fontSize:9,display:"flex",alignItems:"center",gap:2,lineHeight:1.4}}>
          <span style={{color:(t.paidPlayers||[])[i]?"var(--accent2)":"var(--danger)",fontSize:8,flexShrink:0}}>{(t.paidPlayers||[])[i]?"✓":"✗"}</span>
          {findC(p)
            ?<span onClick={e=>{e.stopPropagation();onOpenContact&&onOpenContact(findC(p));}}
                style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:85,
                  color:"var(--accent2)",textDecoration:"underline dotted",cursor:"pointer"}}>
                {p}
              </span>
            :<span style={{color:"var(--text2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:85}}>{p}</span>
          }
        </div>
      ))}
      {dur>1&&<div style={{position:"absolute",bottom:2,right:4,fontSize:9,color:"var(--muted)"}}>{dur}г</div>}
    </div>
  );
})}}
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
      </div>
      {courtModal&&<CourtModal item={courtModal} onClose={()=>setCourtModal(null)} onSave={saveCourt} onDelete={deleteCourt}/>}
      {trainModal&&<TrainingModal item={trainModal} contacts={contacts} trainings={trainings} onClose={()=>setTrainModal(null)} onSave={saveTrain} onDelete={deleteTrain}/>}
    </div>
  );
}

function CourtModal({item,onClose,onSave,onDelete}){
  const [form,setForm]=useState({id:item.id||uid(),date:item.date||TODAY,hour:item.hour||9,court:item.court||"padel",courtNum:item.courtNum||"",duration:item.duration||1,note:item.note||"",isNew:item.isNew!==false});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  return(
    <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={modal}>
        <div style={modalTitle}><span style={{fontSize:14}}>{form.isNew?"Додати корт":"Редагувати корт"} · {form.date} · {String(form.hour).padStart(2,"0")}:00</span><button style={{background:"none",border:"none",color:"var(--muted)",fontSize:20,cursor:"pointer"}} onClick={onClose}>✕</button></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 90px 1fr",gap:8,marginBottom:4}}>
          <Row label="Тип корту"><select style={inp} value={form.court} onChange={e=>set("court",e.target.value)}><option value="padel">🟢 Падл</option><option value="squash">🔵 Сквош</option></select></Row>
          <Row label="№ корту"><select style={inp} value={form.courtNum} onChange={e=>set("courtNum",e.target.value)}><option value="">—</option>{["1","2","3","4","5"].map(n=><option key={n} value={n}>№{n}</option>)}</select></Row>
          <Row label="Тривалість"><select style={inp} value={form.duration} onChange={e=>set("duration",parseInt(e.target.value))}>{[1,2,3,4,5,6].map(d=><option key={d} value={d}>{d} год</option>)}</select></Row>
        </div>
        <Row label="Нотатка"><textarea style={{...inp,minHeight:44}} placeholder="Нотатка..." value={form.note} onChange={e=>set("note",e.target.value)}/></Row>
        <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap"}}><button style={{...btnP,flex:1}} onClick={()=>onSave(form)}>Зберегти</button>{!form.isNew&&<DeleteBtn onDelete={()=>onDelete(form.id)}/>}<button style={btnG} onClick={onClose}>Скасувати</button></div>
      </div>
    </div>
  );
}

function TrainingModal({item,contacts,trainings,onClose,onSave,onDelete}){
  const isGroup=(t)=>t==="padel_grp"||t==="padel_aly";
  const initPlayers=item.players&&item.players.length?[...item.players]:["","","",""];
  const [form,setForm]=useState({id:item.id||uid(),date:item.date||TODAY,hour:item.hour||9,type:item.type||"",duration:item.duration||1,player:item.player||"",paid:item.paid||false,players:initPlayers,paidPlayers:item.paidPlayers||Array(initPlayers.length).fill(false),note:item.note||"",isNew:item.isNew!==false});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const setPlayer=(i,v)=>{const a=[...form.players];a[i]=v;set("players",a);};
  const togglePaidP=(i)=>{const a=[...form.paidPlayers];a[i]=!a[i];set("paidPlayers",a);};
  const addSlot=()=>{set("players",[...form.players,""]);set("paidPlayers",[...form.paidPlayers,false]);};
  const save=()=>{if(!form.type){alert("Оберіть тип!");return;}onSave(form);};
  const contactNames=contacts.map(c=>c.name);
  const calNames=getCalendarNames(trainings);
  const allNames=[...new Set([...contactNames,...calNames])].sort();
  const group=isGroup(form.type);
  return(
    <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={modal}>
        <div style={modalTitle}><span style={{fontSize:14}}>{form.isNew?"Нове тренування":"Редагувати"} · {form.date} · {String(form.hour).padStart(2,"0")}:00</span><button style={{background:"none",border:"none",color:"var(--muted)",fontSize:20,cursor:"pointer"}} onClick={onClose}>✕</button></div>
        <Row label="Тривалість"><select style={inp} value={form.duration} onChange={e=>set("duration",parseInt(e.target.value))}>{[1,2,3,4].map(d=><option key={d} value={d}>{d} год</option>)}</select></Row>
        <Row label="Тип тренування *"><div style={{display:"flex",flexDirection:"column",gap:4}}>{TRAIN_TYPES.map(t=>{const sel=form.type===t.id;return(<button key={t.id} onClick={()=>set("type",t.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 10px",borderRadius:8,border:`1px solid ${sel?t.color:"var(--border2)"}`,background:sel?t.bg:"var(--surface2)",cursor:"pointer",textAlign:"left",fontFamily:"'DM Sans',sans-serif",transition:"all .15s"}}><span style={{width:9,height:9,borderRadius:"50%",background:t.color,flexShrink:0}}/><span style={{fontSize:13,fontWeight:sel?600:400,color:sel?t.color:"var(--muted)"}}>{t.label}</span></button>);})}</div></Row>
        {!group&&(<><Row label="Ім'я гравця"><input style={inp} list="tm-c" placeholder="Ім'я та прізвище" value={form.player} onChange={e=>set("player",e.target.value)}/><datalist id="tm-c">{allNames.map(n=><option key={n} value={n}/>)}</datalist></Row><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:11}}><button onClick={()=>set("paid",!form.paid)} style={{width:22,height:22,borderRadius:6,border:`2px solid ${form.paid?"var(--accent2)":"var(--border2)"}`,background:form.paid?"rgba(74,240,176,.15)":"var(--surface2)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{form.paid&&<span style={{color:"var(--accent2)",fontSize:13}}>✓</span>}</button><span style={{fontSize:13,color:form.paid?"var(--accent2)":"var(--muted)",fontWeight:600}}>Оплачено</span></div></>)}
        {group&&(<Row label="Учасники"><datalist id="tm-cg">{allNames.map(n=><option key={n} value={n}/>)}</datalist>{form.players.map((p,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}><span style={{fontSize:11,color:"var(--muted)",width:18,textAlign:"right",flexShrink:0}}>{i+1}.</span><input style={{...inp,flex:1}} list="tm-cg" placeholder={`Гравець ${i+1}`} value={p} onChange={e=>setPlayer(i,e.target.value)}/>{p&&(<button onClick={()=>togglePaidP(i)} style={{padding:"4px 8px",borderRadius:6,border:"none",flexShrink:0,background:(form.paidPlayers||[])[i]?"rgba(74,240,176,.15)":"rgba(255,79,106,.12)",color:(form.paidPlayers||[])[i]?"var(--accent2)":"var(--danger)",fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:700,cursor:"pointer"}}>{(form.paidPlayers||[])[i]?"✅ Опл":"❌ Не опл"}</button>)}</div>))}<button onClick={addSlot} style={{...btnG,fontSize:11,padding:"5px 12px",marginTop:2}}>+ Додати гравця</button></Row>)}
        <Row label="Нотатка"><textarea style={{...inp,minHeight:44}} placeholder="Нотатка..." value={form.note} onChange={e=>set("note",e.target.value)}/></Row>
        <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap"}}><button style={{...btnP,flex:1}} onClick={save}>Зберегти</button>{!form.isNew&&<DeleteBtn onDelete={()=>onDelete(form.id)}/>}<button style={btnG} onClick={onClose}>Скасувати</button></div>
      </div>
    </div>
  );
}

function Groups({groups,contacts,onUpdate,onOpen,showToast}){
  const wantGroup=contacts.filter(c=>c.status==="group");
  const addM=(gid,name)=>{if(!name)return;onUpdate(groups.map(g=>g.id===gid&&!g.members?.includes(name)?{...g,members:[...(g.members||[]),name]}:g));};
  const remM=(gid,name)=>onUpdate(groups.map(g=>g.id===gid?{...g,members:g.members.filter(m=>m!==name)}:g));
  const delG=(id)=>{if(!confirm("Видалити групу?"))return;onUpdate(groups.filter(g=>g.id!==id));showToast("Видалено");};

  return(
    <div>
      <div style={secTitle}>ГРУПИ</div>
      {wantGroup.length>0&&(
        <div style={{...card,borderColor:"rgba(176,127,255,.25)",marginBottom:14}}>
          <div style={{color:"#b07fff",fontWeight:700,fontSize:12,marginBottom:8}}>🎾 ХОЧУТЬ В ГРУПУ ({wantGroup.length})</div>
          {wantGroup.map(c=>(
            <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:"1px solid #1e253a",fontSize:13}}>
              <span style={{flex:1,fontWeight:500}}>{c.name}</span>
              {c.level&&<span style={{color:"#6b7394",fontSize:11}}>{c.level}</span>}
              {c.channels?.map(ch=><ChannelChip key={ch} channel={ch}/>)}
            </div>
          ))}
        </div>
      )}
      {groups.length===0&&<Empty icon="🎾" text="Груп немає" sub="Натисни + щоб створити"/>}
      {groups.map(g=>{
        const members=g.members||[];
        const spots=(g.max||4)-members.length;
        const pct=g.max?Math.round(members.length/g.max*100):0;
        const col=spots<=0?"#ff4f6a":spots<=1?"#ffb830":"#4af0b0";
        const avail=contacts.filter(c=>!members.includes(c.name));
        return(
          <div key={g.id} style={card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:15}}>{g.name}</div>
                <div style={{display:"flex",gap:6,marginTop:3,flexWrap:"wrap",fontSize:12,color:"#6b7394",alignItems:"center"}}>
                  {g.schedule&&<span>🕐 {g.schedule}</span>}
                  <span style={{color:"#c8f135",fontWeight:600}}>· {g.level}</span>
                  <span style={{color:col,fontWeight:700}}>· {members.length}/{g.max} місць</span>
                </div>
              </div>
              <div style={{display:"flex",gap:6}}><button style={iconBtn} onClick={()=>onOpen(g)}>✏️</button><button style={iconBtn} onClick={()=>delG(g.id)}>🗑</button></div>
            </div>
            <div style={{margin:"8px 0"}}><ProgBar pct={pct} color={col}/></div>
            {g.note&&<div style={{fontSize:13,color:"#9097b5",marginBottom:8}}>{g.note}</div>}
            <div style={{display:"flex",flexWrap:"wrap",gap:5,margin:"8px 0"}}>
              {members.map(m=>(
                <span key={m} style={{padding:"3px 10px",background:"#1a2035",borderRadius:20,fontSize:12,border:"1px solid #2a3248",display:"inline-flex",alignItems:"center",gap:5}}>
                  {m}<button onClick={()=>remM(g.id,m)} style={{background:"none",border:"none",color:"#ff4f6a",cursor:"pointer",fontSize:11}}>✕</button>
                </span>
              ))}
              {!members.length&&<span style={{color:"#6b7394",fontSize:12}}>Учасників немає</span>}
            </div>
            {spots>0?<select onChange={e=>{addM(g.id,e.target.value);e.target.value="";}} style={{...inp,fontSize:12}}><option value="">+ Додати учасника ({spots} місць вільно)</option>{avail.map(c=><option key={c.id} value={c.name}>{c.name} — {getStatus(c.status).label}</option>)}</select>:<div style={{color:"#ff4f6a",fontSize:12,fontWeight:600}}>🔴 Група заповнена</div>}
          </div>
        );
      })}
    </div>
  );
}

// ── GROUP MODAL ───────────────────────────────────────────────────────────────
function GroupModal({item,groups,contacts,onClose,onSave}){
  const [form,setForm]=useState(item||{id:uid(),name:"",schedule:"",max:4,level:"Початківець",note:"",members:[]});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const save=()=>{if(!form.name.trim()){alert("Введи назву!");return;}onSave(item?groups.map(g=>g.id===item.id?form:g):[form,...groups]);};
  return(
    <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={modal}>
        <div style={modalTitle}><span>{item?"Редагувати групу":"Нова група"}</span><button style={{background:"none",border:"none",color:"#6b7394",fontSize:20,cursor:"pointer"}} onClick={onClose}>✕</button></div>
        <Row label="Назва *"><input style={inp} placeholder="Вівторок 19:00" value={form.name} onChange={e=>set("name",e.target.value)}/></Row>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Row label="Розклад"><input style={inp} placeholder="Вт, Чт о 19:00" value={form.schedule} onChange={e=>set("schedule",e.target.value)}/></Row>
          <Row label="Макс. місць"><input style={inp} type="number" min="1" max="20" value={form.max} onChange={e=>set("max",parseInt(e.target.value)||4)}/></Row>
        </div>
        <Row label="Рівень"><select style={inp} value={form.level} onChange={e=>set("level",e.target.value)}>{[...LEVELS,"Мікст"].map(l=><option key={l}>{l}</option>)}</select></Row>
        <Row label="Нотатка"><textarea style={{...inp,minHeight:56,resize:"vertical"}} placeholder="Додаткова інформація..." value={form.note} onChange={e=>set("note",e.target.value)}/></Row>
        <div style={{display:"flex",gap:8}}><button style={{...btnP,flex:1}} onClick={save}>Зберегти</button><button style={btnG} onClick={onClose}>Скасувати</button></div>
      </div>
    </div>
  );
}

// ── POSTS ─────────────────────────────────────────────────────────────────────
function Posts({posts,onUpdate,onOpen,showToast}){
  const [filter,setFilter]=useState("all");
  const filtered=filter==="all"?posts:posts.filter(p=>p.channels?.includes(filter));
  const del=(id)=>{if(!confirm("Видалити пост?"))return;onUpdate(posts.filter(p=>p.id!==id));showToast("Видалено");};
  return(
    <div>
      <div style={secTitle}>ПОСТИ ТА РЕКЛАМА</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
        <button style={filter==="all"?fOn:fOff} onClick={()=>setFilter("all")}>Всі ({posts.length})</button>
        {CHANNELS.map(ch=>{const cnt=posts.filter(p=>p.channels?.includes(ch.id)).length;if(!cnt)return null;return <button key={ch.id} style={filter===ch.id?fOn:fOff} onClick={()=>setFilter(ch.id)}>{ch.emoji} {ch.label} ({cnt})</button>;})}
      </div>
      {!filtered.length&&<Empty icon="📣" text="Постів немає" sub="Натисни + щоб додати"/>}
      {filtered.map(p=>(
        <div key={p.id} style={card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div><div style={{fontWeight:600,fontSize:14}}>{p.title}</div><div style={{color:"#6b7394",fontSize:11,marginTop:2}}>{formatDate(p.date)} {p.type&&<span style={{color:"#b07fff"}}>· {p.type}</span>}</div></div>
            <div style={{display:"flex",gap:6}}><button style={iconBtn} onClick={()=>onOpen(p)}>✏️</button><button style={iconBtn} onClick={()=>del(p.id)}>🗑</button></div>
          </div>
          {p.channels?.length>0&&<div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:6}}>{p.channels.map(ch=><ChannelChip key={ch} channel={ch}/>)}</div>}
          {p.text&&<div style={{marginTop:8,color:"#9097b5",fontSize:13,lineHeight:1.55}}>{p.text.slice(0,200)}{p.text.length>200?"...":""}</div>}
          {p.result&&<div style={{marginTop:6,padding:"6px 10px",background:"rgba(74,240,176,.08)",borderRadius:6,color:"#4af0b0",fontSize:12}}>📊 {p.result}</div>}
        </div>
      ))}
    </div>
  );
}

// ── POST MODAL ────────────────────────────────────────────────────────────────
function PostModal({item,posts,onClose,onSave}){
  const [form,setForm]=useState(item||{id:uid(),title:"",channels:[],type:"Пост",date:TODAY,text:"",result:""});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const tgCh=(id)=>set("channels",(form.channels||[]).includes(id)?(form.channels||[]).filter(c=>c!==id):[...(form.channels||[]),id]);
  const save=()=>{if(!form.title.trim()){alert("Введи назву!");return;}onSave(item?posts.map(p=>p.id===item.id?form:p):[form,...posts]);};
  return(
    <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={modal}>
        <div style={modalTitle}><span>{item?"Редагувати пост":"Новий пост"}</span><button style={{background:"none",border:"none",color:"#6b7394",fontSize:20,cursor:"pointer"}} onClick={onClose}>✕</button></div>
        <Row label="Назва / Тема *"><input style={inp} placeholder="Набір у групу..." value={form.title} onChange={e=>set("title",e.target.value)}/></Row>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Row label="Тип"><select style={inp} value={form.type} onChange={e=>set("type",e.target.value)}>{["Пост","Сторіс","Реклама","Оголошення","Відео"].map(t=><option key={t}>{t}</option>)}</select></Row>
          <Row label="Дата"><input style={inp} type="date" value={form.date} onChange={e=>set("date",e.target.value)}/></Row>
        </div>
        <Row label="Платформи">
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {CHANNELS.filter(c=>c.id!=="personal").map(ch=>{const s=(form.channels||[]).includes(ch.id);return <button key={ch.id} onClick={()=>tgCh(ch.id)} style={{padding:"6px 12px",borderRadius:8,border:`1px solid ${s?ch.color:"#2a3248"}`,background:s?"rgba(255,255,255,.05)":"#1a2035",color:s?ch.color:"#9097b5",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600,cursor:"pointer"}}>{ch.emoji} {ch.label}</button>;})}
          </div>
        </Row>
        <Row label="Текст посту"><textarea style={{...inp,minHeight:72,resize:"vertical"}} placeholder="Текст..." value={form.text} onChange={e=>set("text",e.target.value)}/></Row>
        <Row label="Результат / реакції"><input style={inp} placeholder="12 лайків, 3 запити..." value={form.result} onChange={e=>set("result",e.target.value)}/></Row>
        <div style={{display:"flex",gap:8}}><button style={{...btnP,flex:1}} onClick={save}>Зберегти</button><button style={btnG} onClick={onClose}>Скасувати</button></div>
      </div>
    </div>
  );
}



ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
